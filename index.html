secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "꼬리 자르기", "endSub": "꼬리가 모든 걸 짊어졌다. 진짜 머리는 웃고 있다.", "keyNote": "", "lockNote": "", "endKind": "normal", "endOrder": 3, "endImg": "엔딩_꼬리 자르기"}, {"id": "c8_end_R", "name": "엔딩 피의 대가", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n하린은 단상으로 걸어갔다. 아무도 막지 않았다. 너무 조용히 걸었기 때문에.\n강태오: …하린아?\n서하린: 아빠가 그랬어요. 내 기억을 믿지 마라.\n서하린: 그래서 내 눈을 믿기로 했어요.\n[위험] 총성 두 발.\n생중계 카메라는 모든 것을 기록했다. 하린은 총을 내려놓고, 두 손을 머리 위로 올렸다. 마준기는 끝까지 움직이지 않았다.\n강태오는 병원으로 옮겨지던 중 숨졌다. 그의 집무실에서는 아무것도 나오지 않았다. 모든 기록은 이미 지워져 있었다.\n하린은 살인죄로 징역 15년을 받았다. 법정에서 그녀는 끝까지 이유를 말하지 않았다. 말해도 아무도 믿지 않을 테니까.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "피의 대가", "endSub": "하린은 아버지의 원수를 직접 갚았다.", "keyNote": "", "lockNote": "", "endKind": "bad", "endOrder": 12, "endImg": "엔딩_피의 대가"}, {"id": "c8_end_H", "name": "엔딩 상속자", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n하린은 박수를 쳤다. 다른 사람들처럼.\n강태오가 단상에서 내려와 하린을 안아주었다. 플래시가 터졌다. 다음 날 신문 1면이 되었다. 슬픔을 함께 나누는 가족.\n3년 뒤, 강태오가 은퇴하며 하린을 대표로 지명했다. 하린은 받아들였다.\n취임 첫날, 하린은 서버실 깊은 곳의 폴더를 열었다. PROJECT_JANSANG. 승인자: 강태오.\n하린은 그 폴더를 삭제하지 않았다. 승인자 이름만, 자기 이름으로 바꿨다.\n문 앞에는 마준기가 서 있었다. 장갑을 낀 채로. 새 주인을 기다리는 사람처럼.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "상속자", "endSub": "하린은 침묵하고, 네메시스의 대표가 되었다.", "keyNote": "", "lockNote": "", "endKind": "normal", "endOrder": 6, "endImg": "엔딩_상속자"}, {"id": "c8_end_D", "name": "엔딩 도주자", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n밤 11시. 화물선이 하운 항을 떠난다. 갑판 위의 도윤은 멀어지는 도시의 불빛을 바라본다.\n{칩 = 도윤} 셔츠 안의 칩. 언젠가, 이걸 믿어줄 사람이 있는 곳에서.\n{칩 != 도윤} 빈손이다. 증명할 것도, 지킬 것도 없다. 남은 건 자기 기억 하나.\n등 뒤에서 강태오의 취임 연설이 대형 전광판에 흘러나온다. 소리는 바다에 묻힌다.\n도윤은 리콜 임플란트가 있는 뒤통수를 만진다. 이 기억만은, 아무도 고치지 못하게 할 것이다.\n하운에서 그의 이름은 아직도 살인자로 남아 있다.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "도주자", "endSub": "도윤은 진실을 품은 채 도시를 떠났다.", "keyNote": "", "lockNote": "", "endKind": "normal", "endOrder": 4, "endImg": "엔딩_도주자"}, {"id": "c8_E", "name": "엔딩 덮어쓴 기억", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n오후 3시. 네메시스 타워 1층 그랜드홀.\n강태오의 취임 기자회견. 단상 옆에, 하운 경찰청 강력계 한서윤 형사가 서 있다. 특별 공로 표창을 받기 위해.\n강태오: 한서윤 형사님은 이번 사건에서 리콜 증거의 가치를 끝까지 지켜주셨습니다.\n서윤은 박수를 받으며 고개를 숙인다. 기분이 좋다. 그런데 어딘가 이상하다.\n수첩을 펼치면 낯선 글씨의 메모들이 있다. 0.3초. 21:48. 마스터 키 #2. 내 기억을 믿지 마라.\n누가 이런 걸 적었을까. 서윤은 그 페이지를 찢어 휴지통에 버린다.\n강태오: 좋은 형사예요. 원칙을 지키니까.\n[글리치] 그 말을, 어디서 들었더라.\n…아무것도 아니다. 리콜은 거짓말하지 않는다.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "덮어쓴 기억", "endSub": "서윤은 기억하지 못한다. 자신이 무엇을 알고 있었는지.", "keyNote": "", "lockNote": "", "endKind": "bad", "endOrder": 10, "endImg": "엔딩_덮어쓴 기억"}, {"id": "c8_F", "name": "엔딩 침묵", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n오후 3시. 네메시스 타워 1층 그랜드홀.\n강태오의 취임 기자회견은 예정대로 진행되었다. 아무도 끼어들지 않았다. 끼어들 사람이 남아 있지 않았다.\n{서윤 = 사망} 한서윤 형사의 순직은 단신으로 처리되었다.\n{하린 = 체포} 서하린은 수감되었다.\n{하린 = 사망} 서하린의 사인은 심장마비로 기록되었다. 아버지와 같은.\n{도윤 = 체포} 도윤은 교도소 안에서 끝까지 무죄를 주장했다. 아무도 듣지 않았다.\n{도윤 = 사망} 도윤의 이름은 살인자로 남았다.\n사건 기록은 봉인되었다. 리콜은 거짓말하지 않는다. 이 도시는 오늘도 그렇게 믿는다.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "침묵", "endSub": "아무도 남지 않았다. 사건은 종결되었다.", "keyNote": "", "lockNote": "", "endKind": "bad", "endOrder": 11, "endImg": "엔딩_침묵"}, {"id": "c8_end_F2", "name": "엔딩 침묵 (송신탑)", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n총성. 진행 바는 87%에서 멈췄다.\n도윤은 송신탑 난간에 기댄 채 미끄러져 내려간다. 마지막으로 본 것은 하운의 하늘이었다. 나흘 만에, 비가 그쳐 있었다.\n[경고] 도윤 — 사망\n강태오의 취임 기자회견은 예정대로 진행되었다. 아무도 끼어들지 않았다.\n사건 기록은 봉인되었다. 리콜은 거짓말하지 않는다. 이 도시는 오늘도 그렇게 믿는다.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "마지막 송출", "endSub": "아무도 남지 않았다. 사건은 종결되었다.", "keyNote": "", "lockNote": "", "endKind": "normal", "endOrder": 5, "endImg": "엔딩_마지막 송출"}, {"id": "c8_hidden", "name": "엔딩 잔상의 주인", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n검사가 강태오를 데리고 나간 뒤, 서윤은 홀에 혼자 남았다.\n도윤이 보내온 파일이 하나 더 있었다. 칩의 가장 안쪽, 암호가 걸린 마지막 기억. 암호는 0312.\n[시스템] [백업 기억 재생 — 소유자: 서진혁 / 사건 당일 21:30 / 수신인 지정: 이 기억을 끝까지 찾아온 사람]\n[회상] 서재. 서진혁이 카메라처럼 허공을 바라본다. 자기 눈으로 자기 기억을 남기는 사람처럼.\n[회상] “이걸 보고 있다면, 당신은 0.3초를 찾아냈고, 문 너머의 목소리를 들었고, 장갑 낀 손을 보았겠지.”\n[회상] “나는 리콜을 만들었다. 사람들이 서로를 믿을 수 있게. 그런데 그 기술이, 사람들이 자기 자신조차 믿지 못하게 만들었다.”\n[회상] “그러니 부탁한다. 기억을 믿지 마라. 대신 기억을 의심하는 당신 자신을 믿어라.”\n[회상] “그리고 하린에게, 아빠는 화나지 않았다고 전해 줘.”\n[알림] 모든 잔상을 모았습니다\n서윤은 그 기억을 하린에게 보냈다. 답장은 오지 않았다. 대신 다음 날, 서진혁의 무덤 앞에 흰 국화 두 송이가 놓여 있었다.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "잔상의 주인", "endSub": "숨겨진 엔딩. 서진혁의 가장 깊은 기억.", "keyNote": "", "lockNote": "", "endKind": "hidden", "endOrder": 16, "endImg": "엔딩_잔상의 주인"}], "feed": [{"id": "f1", "author": "기자", "handle": "@haun_daily", "text": "[속보] 네메시스 서진혁 대표, 자택에서 숨진 채 발견… 경찰 “사인 조사 중”", "cond": "방문:현장 도착", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f2", "author": "시민", "handle": "@rainy_haun", "text": "네메시스 타워 앞에 경찰차 열 대 넘게 와 있음. 대표 죽었다는 거 진짜야? 리콜 만든 사람이 죽다니", "cond": "방문:현장 도착", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f3", "author": "기자", "handle": "@haun_daily", "text": "[속보] 경찰, 용의자 도윤(29) 전국 수배… “피해자 리콜에 얼굴 찍혀”", "cond": "방문:수배 발령", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f4", "author": "???", "handle": "@afterimage_2047", "text": "이 글이 올라왔다면, 나는 더 이상 말할 수 없게 된 것이다.\n예약해 둔 글은 모두 일곱 개다.", "cond": "방문:수배 발령", "clue": "예약된 계정", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f5", "author": "미궁", "handle": "@labyrinth", "text": "@afterimage가 답을 준다면, 나는 질문을 준다. 답은 당신이 찾아.\n\n서재에 잔이 둘. 하나는 깨끗이 씻겨 있었다.\n21시의 손님은 운전을 해야 했고, 원래 술을 입에 대지 않는다.", "cond": "방문:수배 발령", "clue": "", "quiz": {"on": true, "ask": "씻긴 잔의 주인은?", "opts": [{"text": "21시의 손님, D.", "ok": false}, {"text": "21시 48분 이후에 찾아온 다른 손님", "ok": true}, {"text": "서진혁 자신", "ok": false}], "clue": "두 번째 손님", "effects": "수수께끼 +1", "failEffects": "", "okText": "맞아. D.가 떠난 뒤 그 집 문은 한 번 더 열렸어. 문을 열어준 건 서진혁 자신이고. 반가운 손님이었던 거지. 그때까지는.", "failText": "아니. 질문은 한 번뿐이야. 다음엔 잔을 더 오래 봐."}}, {"id": "f6", "author": "시민", "handle": "@midnight_cab", "text": "어젯밤 23시 50분쯤 네메시스 타워 지하 주차장에서 검은 SUV가 미친 듯이 빠져나갔음. 번호판 가려져 있었고. 혹시 이것도 관련 있나", "cond": "방문:속보", "clue": "검은 SUV", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f7", "author": "???", "handle": "@afterimage_2047", "text": "누군가 내 마지막 기억을 보고 있다면, 빈틈을 찾아라.", "cond": "방문:2장 표지", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f8", "author": "시민", "handle": "@recall_lover", "text": "리콜에 얼굴 찍혔으면 끝난 거지 뭘 더 조사해. 리콜은 거짓말 안 함", "cond": "방문:2장 표지", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f9", "author": "미궁", "handle": "@labyrinth", "text": "출입기록이 30분 사라진 밤.\n다음 날 아침, 현장에서 혼자만 실내에서 장갑을 끼고 있던 사람이 있었다.\n장갑은 손을 따뜻하게 하려고 끼는 게 아니야.", "cond": "방문:3장 표지", "clue": "", "quiz": {"on": true, "ask": "장갑 아래에 숨긴 것은?", "opts": [{"text": "지문", "ok": false}, {"text": "다친 손가락", "ok": true}, {"text": "반지 자국", "ok": false}], "clue": "23:39의 인증 실패", "effects": "수수께끼 +1", "failEffects": "", "okText": "맞아. 올라갈 땐 멀쩡했던 손가락이, 내려올 땐 다쳐 있었어. 엘리베이터는 그걸 기억해. 로그를 보낼게.", "failText": "지문이라면 그 사람은 장갑을 벗지 않았겠지. 틀렸어."}}, {"id": "f10", "author": "???", "handle": "@afterimage_2047", "text": "리콜은 증거가 아니다. 리콜은 편집될 수 있다.\n그 기술의 이름은 PROJECT 잔상.", "cond": "방문:3장 표지", "clue": "잔상이라는 이름", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f11", "author": "강태오", "handle": "@kang_nemesis", "text": "진혁이를 보내며. 그가 평생 지키려던 것을, 이제 제가 끝까지 지키겠습니다.", "cond": "방문:추모홀", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f12", "author": "???", "handle": "@afterimage_2047", "text": "칩은 하린에게. 칩은 하린에게.", "cond": "방문:강태오의 질문", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f13", "author": "기자", "handle": "@haun_daily", "text": "[단독] 서진혁 대표 딸, 사건 전날 부친과 상속 문제로 격한 언쟁… 경찰 “참고인 조사”", "cond": "방문:4장 표지", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f14", "author": "경비", "handle": "@guard_night", "text": "우리 건물 그날 72층 엘베 CCTV 내가 직접 봤는데. 대표 딸 22시 41분에 올라왔다가 문도 안 두드리고 4분 만에 다시 내려감. 근데 기자들 왜 이건 안 씀?", "cond": "방문:4장 표지", "clue": "엘리베이터 CCTV", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f15", "author": "미궁", "handle": "@labyrinth", "text": "22:41, 딸이 올라갔다. 22:45, 딸이 내려왔다.\n4분 동안 문은 열리지 않았고 초인종도 울리지 않았다.\n모두가 그 4분을 의심한다. 아무도 문 안쪽을 의심하지 않는다.", "cond": "방문:4장 표지", "clue": "", "quiz": {"on": true, "ask": "그녀는 왜 문 앞에서 돌아섰을까?", "opts": [{"text": "아버지가 문을 열어주지 않아서", "ok": false}, {"text": "문 안에 이미 다른 사람이 있어서", "ok": true}, {"text": "애초에 72층에 내리지 않아서", "ok": false}], "clue": "현관 센서", "effects": "수수께끼 +1", "failEffects": "", "okText": "맞아. 그날 현관 안쪽 센서에는 아버지 말고 한 사람이 더 잡혀 있었어. 딸을 보는 눈은 방향이 틀렸어.", "failText": "아니. 그녀는 분명 문 앞까지 갔어. 다시 생각해 봐. 아, 다시는 없지."}}, {"id": "f16", "author": "???", "handle": "@afterimage_2047", "text": "보안팀 마스터 키는 두 개다. 하나는 내 것이었다.\n나머지 하나는 누구의 것일까.", "cond": "방문:5장 표지", "clue": "두 개의 마스터 키", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f17", "author": "미궁", "handle": "@labyrinth", "text": "질문에 답해 줘서 고마워. 이번엔 내 차례야.\n나는 사람을 길 잃게 하는 이름을 가졌다. 그런데 길 잃은 아이 하나를 데려다 키웠다.\n언젠가 만나게 될 거야. 그땐 알아봐 줘.", "cond": "수수께끼 >= 2, 방문:5장 표지 | 수수께끼 >= 2, 방문:6장 라우터", "clue": "길 잃은 아이", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f18", "author": "미궁", "handle": "@labyrinth", "text": "죽은 사람은 23:20에 멈췄다.\n그의 기억은 23:24에 다시 쓰였다.\n죽은 자의 일기장을 고쳐 쓸 수 있는 손은, 생각보다 훨씬 적다.", "cond": "방문:K.T. | 방문:6장 라우터", "clue": "", "quiz": {"on": true, "ask": "그 손을 가진 사람은?", "opts": [{"text": "칩을 손에 넣은 사람이라면 누구나", "ok": false}, {"text": "리콜 원본에 쓰기 권한이 있는 사람", "ok": true}, {"text": "부검을 맡은 검시관", "ok": false}], "clue": "쓰기 권한", "effects": "수수께끼 +1", "failEffects": "", "okText": "맞아. 하운 전체에서 리콜 원본에 쓸 수 있는 계정은 둘뿐이야. 하나는 이미 죽은 사람 것이고.", "failText": "칩은 복사본이야. 원본은 그렇게 쉽게 고쳐지지 않아. 틀렸어."}}, {"id": "f19", "author": "기자", "handle": "@haun_daily", "text": "[인터뷰] 박주원 형사 “리콜은 거짓말하지 않는다. 이번 사건이 그 증거”", "cond": "방문:6장 라우터", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f20", "author": "???", "handle": "@afterimage_2047", "text": "그날 밤 나를 찾아온 사람은 둘이었다.\n한 사람은 나를 설득하러, 한 사람은 나를 끝내러.", "cond": "방문:6장 라우터", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f21", "author": "기자", "handle": "@haun_daily", "text": "[속보] 서진혁 대표 살해 용의자 도윤, 도주 중 추락사… 경찰 “사건 사실상 종결”", "cond": "도윤 = 사망", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f22", "author": "기자", "handle": "@haun_daily", "text": "[속보] 서하린 체포… 부친 살해 교사 혐의", "cond": "하린 = 체포", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f23", "author": "기자", "handle": "@haun_daily", "text": "[속보] 강태오 대표, 오늘 오후 3시 네메시스 신임 대표 취임 기자회견", "cond": "방문:반격 끝", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f24", "author": "???", "handle": "@afterimage_2047", "text": "이것이 마지막 글이다.\n나는 그 기술을 만든 것을 후회한다. 하린아, 미안하다.", "cond": "방문:반격 끝", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}, {"id": "f25", "author": "미궁", "handle": "@labyrinth", "text": "질문은 여기까지야. 네 개 중 {{수수께끼}}개에 답이 돌아왔어.\n답을 찾는 사람이 하나라도 있는 한, 이 도시는 아직 길을 잃지 않았어.", "cond": "방문:반격 끝, 수수께끼 >= 1", "clue": "", "quiz": {"on": false, "ask": "", "opts": [], "clue": "", "effects": "", "failEffects": "", "okText": "", "failText": ""}}], "images": {"표지_프롤로그": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUAAAAC0BAMAAAAXyugiAAAAD1BMVEWWlohSVU4mKCZoHiAKCwzSJCWfAAAKEklEQVR42u1dy3LbyBU9uOQ6gsfrsLrE2Q8rmg+YGuuz46p8wDCl1KzJ9CDbaAw5azaz6NdtoNEPCpRoFwCJgpu00bp97j331XDziNs+CMsEv/MJruWtT1Dc/BLL2z6bxwWD3zkGtQTvmv62JfgFNyvI5sdvQoJAu2jx963FiwQXLl4wOD3BDamLzzeZYHfzWqxFcdnrN4tBIfNnqbPw661jUIIAKIKyF+aV31+BzIv+aG56AjkBolyCIEVmgvpLT0jBT0oBpNwIoN99Kwnqm7Hbulc+7t8pmeA01i7A4Hgixa9vZQeN2QBZrJnFVWZFSVlxOQOjQFA0jTBgn7rrAwApik4twWuI8LfUmz/X2sGC6ZDTD/2VnqCQL6nblmNQ+4NXEOBzm15iUSVBa2CUFZQX11CAGq15AfbzCJBLcDypgbxU+QpD/NeaiXNzBvR3c3aGXFTaQaO/msK0zfM/A4Md4ZmoHXxpe73IDRrAfDf67b4Kg+NJjc1y7ExIUEHg7nx3nnr/DgKbQiu6pkJ7VOeQzKbEcDEJW7PE8pXzb9ZQ12ixstAnPQPliEPZdVQeg4oKZirSyR5ZFZMMccfUI4pNNz4lZUXAXXr+xS75WtobalUO/haTKBC4W9olm0amsAqbFGE5F1+BSfbnZvqsxeDo5twfHC5x2QTnw+A1uFhRLuEoiu3BQILEPL7XLPFVuHg2CSoCxHMKg6JchF6LHe6sqYiYmfCz6biuSZzviUHrXqQEeDZ2sESI605xh8qJD6EPGIvwkgKcjYvXIiAw5mARC9oVMTpkTldihqe+nT4r/MHmR3Edd+Zz6q6fyjGYz81U+YP+nd9SGPzZZSuoND9o0h+UdrH8paIol5YpMVfjLBc/unwfN9fO+wIfHwVQE2oMUM4fLE7urI+XmplMfsszyeoXAMDpH7fBxdYKtE5l/2fe8SN9hR1s7keLOA4vfdQc2sSUHTy4Owg7ry9Oqtv342Lr/YpnN3TvopTW69CmUImxluQ8ZoesITsrlvfKu/xmCrAxsLWI7ftj0IoPIMfFrQvh9nAMDWE+lhfiWl4Jg56LjwaDH/ovnou7yyQ44dpX+YNajIyLLQYPZ+G5eFNaJmjumfk1KJvyYKwXo3I2VhHnYp8BaRgXF7v8IlAGNYyNxwEUk3WURAwG21EagXOLcB/MTZSoI0mSOvNTX49fu8G1pI5Gtd1OdubwN/jw4WiO4L72g7K <script>/* =========================================================
   대본 해석기 (편집기와 게임이 같이 씀)
   한 줄 = 하나의 문장.
     박주원: 대사                → 말하는 사람 (인물 목록에 있는 이름일 때)
     [회상] / [글리치] / [위험] / [시스템]  문장   → 효과
     [경고] 문장 / [알림] 문장    → 빨간 / 초록 배너
     [단서: 이름]                → 단서 획득
     [삽화: 이름 / 글리치]        → 삽화 (방식: 스며들기·글리치·플래시, 생략하면 스며들기)
     [변경: 신념 +1, 공유 = 켜짐] → 변수 바꾸기
     {조건} 문장                 → 조건이 맞을 때만 보임
   조건: 신념 <= -1, 단서:이름, !단서:이름, 방문:장면이름, 공유  (쉼표 = 그리고)
   ========================================================= */
const VN = {};

VN.FX = {"회상":"recall", "글리치":"glitch", "위험":"danger", "시스템":"system"};
VN.FX_NAMES = {recall:"회상", glitch:"글리치", danger:"위험", system:"시스템"};
VN.ILL_MODE = {"스며들기":"dither", "글리치":"glitch", "플래시":"flash"};
VN.ILL_NAMES = {dither:"스며들기", glitch:"글리치", flash:"플래시"};

VN.parseLine = function(raw, charNames){
  let s = raw.trim(), cond = "";
  const it = {raw};
  if(s.startsWith("{") && !s.startsWith("{{")){
    const e = s.indexOf("}");
    if(e > 0){ cond = s.slice(1, e).trim(); s = s.slice(e + 1).trim(); }
  }
  it.cond = cond;
  let m;
  if((m = s.match(/^\[단서\s*:\s*(.+?)\]\s*$/))){ it.kind = "clue"; it.clue = m[1].trim(); return it; }
  if((m = s.match(/^\[변경\s*:\s*(.+?)\]\s*$/))){ it.kind = "set"; it.effects = m[1].trim(); return it; }
  if((m = s.match(/^\[삽화\s*:\s*(.+?)\]\s*$/))){ const parts = m[1].split("/").map(x => x.trim()); it.kind = "ill"; it.name = parts[0]; it.mode = VN.ILL_MODE[parts[1]] || "dither"; return it; }
  if((m = s.match(/^\[(경고|알림)\]\s*(.*)$/))){ it.kind = "alert"; it.good = m[1] === "알림"; it.text = m[2]; return it; }
  it.kind = "text";
  if((m = s.match(/^\[(회상|글리치|위험|시스템)\]\s*(.*)$/))){ it.fx = VN.FX[m[1]]; s = m[2]; }
  const c = s.indexOf(":");
  if(c > 0 && c <= 12){
    const nm = s.slice(0, c).trim();
    if(charNames && charNames.includes(nm)){ it.speaker = nm; s = s.slice(c + 1).trim(); }
  }
  it.text = s.replace(/\\n/g, "\n");
  return it;
};

VN.lineToRaw = function(it){
  let p = it.cond ? `{${it.cond}} ` : "";
  if(it.kind === "clue") return p + `[단서: ${it.clue}]`;
  if(it.kind === "set") return p + `[변경: ${it.effects}]`;
  if(it.kind === "ill") return p + `[삽화: ${it.name}${it.mode && it.mode !== "dither" ? " / " + VN.ILL_NAMES[it.mode] : ""}]`;
  if(it.kind === "alert") return p + `[${it.good ? "알림" : "경고"}] ${it.text}`;
  if(it.fx) p += `[${VN.FX_NAMES[it.fx]}] `;
  if(it.speaker) p += `${it.speaker}: `;
  return p + String(it.text || "").replace(/\n/g, "\\n");
};

VN.parseBody = function(body, charNames){
  return String(body || "").split("\n").filter(l => l.trim()).map(l => VN.parseLine(l, charNames));
};

/* 값: 숫자 / 켜짐·꺼짐 / 글자 */
VN.val = function(v){
  v = String(v).trim();
  if(v === "켜짐" || v === "참") return true;
  if(v === "꺼짐" || v === "거짓") return false;
  if(v !== "" && !isNaN(Number(v))) return Number(v);
  return v;
};
VN.show = function(v){ return v === true ? "켜짐" : v === false ? "꺼짐" : String(v); };

/* 조건 */
VN.OPS = [">=", "<=", "!=", "=", ">", "<"];
/* 조건 묶음: "|" 로 나눈 묶음 중 하나라도 맞으면 참 (묶음 안은 쉼표 = 그리고) */
VN.condGroups = function(str){ return String(str || "").split("|").map(g => VN.parseCond1(g)).filter(g => g.length); };
VN.groupsToStr = function(groups){ return groups.filter(g => g.length).map(g => VN.condToStr(g)).join(" | "); };
VN.parseCond = function(str){ return [].concat(...VN.condGroups(str)); };
VN.parseCond1 = function(str){
  return String(str || "").split(",").map(x => x.trim()).filter(Boolean).map(p => {
    let neg = false;
    if(p.startsWith("!")){ neg = true; p = p.slice(1).trim(); }
    let m;
    if((m = p.match(/^단서\s*:\s*(.+)$/))) return {kind:"clue", name:m[1].trim(), neg};
    if((m = p.match(/^방문\s*:\s*(.+)$/))) return {kind:"visit", name:m[1].trim(), neg};
    if((m = p.match(/^엔딩\s*:\s*(.+)$/))) return {kind:"ending", name:m[1].trim(), neg};
    if((m = p.match(/^확률\s*:\s*(\d+)\s*%?$/))) return {kind:"chance", value:m[1], neg};
    for(const op of VN.OPS){
      const i = p.indexOf(op);
      if(i > 0) return {kind:"var", name:p.slice(0, i).trim(), op, value:p.slice(i + op.length).trim(), neg};
    }
    return {kind:"var", name:p, op:"", value:"", neg};
  });
};
VN.condToStr = function(list){
  return list.map(c => (c.neg ? "!" : "") + (c.kind === "clue" ? `단서:${c.name}` : c.kind === "visit" ? `방문:${c.name}` : c.kind === "ending" ? `엔딩:${c.name}` : c.kind === "chance" ? `확률:${c.value}` : c.op ? `${c.name} ${c.op} ${c.value}` : c.name)).join(", ");
};

/* 효과 */
VN.parseEffects = function(str){
  return String(str || "").split(",").map(x => x.trim()).filter(Boolean).map(p => {
    let m;
    if((m = p.match(/^단서\s*:\s*(.+)$/))) return {kind:"clue", name:m[1].trim()};
    if((m = p.match(/^(.+?)\s*([+-])\s*(\S+)$/)) && !isNaN(Number(m[3]))) return {kind:"var", name:m[1].trim(), op:m[2], value:m[3]};
    if((m = p.match(/^(.+?)\s*=\s*(.*)$/))) return {kind:"var", name:m[1].trim(), op:"=", value:m[2].trim()};
    return {kind:"var", name:p, op:"=", value:"켜짐"};
  });
};
VN.effectsToStr = function(list){
  return list.map(e => e.kind === "clue" ? `단서:${e.name}` : e.op === "=" ? `${e.name} = ${e.value}` : `${e.name} ${e.op}${e.value}`).join(", ");
};

/* ---------- 소리 (파일 없이 브라우저에서 합성) ---------- */
const SND = (() => {
  let ctx = null, master, ambBus, sfxBus, noiseBuf, rainBuf = null, cur = null, curName = "none", on = true, tickT = null;
  let vol = {amb:0.7, sfx:0.7};
  try{ on = localStorage.getItem("vn_sound") !== "off"; const v = JSON.parse(localStorage.getItem("vn_vol") || "null"); if(v) vol = Object.assign(vol, v); }catch(e){}
  function init(){
    if(ctx) { if(ctx.state === "suspended") ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = on ? 1 : 0; master.connect(ctx.destination);
    ambBus = ctx.createGain(); ambBus.gain.value = 0.8 * vol.amb; ambBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 1.0 * vol.sfx; sfxBus.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setTimeout(loadRec, 50);
    return true;
  }
  const now = () => ctx.currentTime;
  function noise(){ const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s; }
  function env(g, t, a, peak, d){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(freq, type, t, a, peak, d, dest, slideTo){
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + a + d);
    env(g, t, a, peak, d); o.connect(g); g.connect(dest || sfxBus); o.start(t); o.stop(t + a + d + 0.05);
  }
  function burst(t, dur, peak, ftype, freq, q){
    const s = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = ftype || "bandpass"; f.frequency.value = freq || 2000; f.Q.value = q || 1;
    env(g, t, 0.005, peak, dur); s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
  }

  /* 미리 만들어 두는 10초짜리 빗소리 (반복 재생해도 이음매가 없게) */
  function makeRain(){
    if(rainBuf) return rainBuf;
    const sr = ctx.sampleRate, sec = 13, L = sr * sec, X = Math.floor(sr * 0.4);
    rainBuf = ctx.createBuffer(2, L, sr);
    for(let ch = 0; ch < 2; ch++){
      const d = new Float32Array(L + X);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, lp = 0, hp = 0;
      const k = Math.exp(-2 * Math.PI * 2600 / sr);

/* ---------- 조건 / 효과 ---------- */
let ROLLS = {};
function getVar(n){
  if(n === "회차") return META.plays || 1;
  if(n === "발견한 엔딩") return seenEndings().length;
  return S.vars[n];
}
function endingSeen(name){
  const ids = seenEndings();
  return ENDINGS.some(e => (e.name === name || e.endTitle === name) && ids.includes(e.id));
}
function condOK(str){
  const gs = VN.condGroups(str);
  return !gs.length || gs.some(g => condOK1(g));
}
function condOK1(list){
  return list.every(c => {
    let r;
    if(c.kind === "clue") r = S.clues.includes(c.name);
    else if(c.kind === "visit"){ const sc = BY_NAME[c.name]; r = !!sc && S.visited.includes(sc.id); }
    else if(c.kind === "ending") r = endingSeen(c.name);
    else if(c.kind === "chance"){ const k = "c" + c.value; if(ROLLS[k] === undefined) ROLLS[k] = Math.random() * 100 < Number(c.value); r = ROLLS[k]; }
    else {
      const a = getVar(c.name);
      if(!c.op) r = !!a;
      else {
        const b = VN.val(c.value);
        r = c.op === ">=" ? a >= b : c.op === "<=" ? a <= b : c.op === ">" ? a > b : c.op === "<" ? a < b : c.op === "!=" ? a !== b : a === b;
      }

    if(e.op === "+") S.vars[e.name] = (Number(S.vars[e.name]) || 0) + Number(v);
    else if(e.op === "-") S.vars[e.name] = (Number(S.vars[e.name]) || 0) - Number(v);

    const dd = VARDEF[e.name];
    if(dd && typeof S.vars[e.name] === "number"){
      if(dd.min !== undefined && dd.min !== "" && S.vars[e.name] < Number(dd.min)) S.vars[e.name] = Number(dd.min);
      if(dd.max !== undefined && dd.max !== "" && S.vars[e.name] > Number(dd.max)) S.vars[e.name] = Number(dd.max);

/* ---------- 선택 알림 (대사 사이에 작게 뜨는 줄) ---------- */
function notice(text, kind){

  if(t.startsWith("!")){ t = t.slice(1).trim(); kind = kind === "up" ? "up warn" : kind === "down" ? "down warn" : "warn"; }
  if(kind) SND.fx(kind.includes("warn") ? "down" : kind.startsWith("up") ? "up" : kind.startsWith("down") ? "down" : "system");

          out.data[i] = on ? src.data[i] : 10; out.data[i + 1] = on ? src.data[i + 1] : 11; out.data[i + 2] = on ? src.data[i + 2] : 12; out.data[i + 3] = 255; }

function showLine(l, key){

function doneTyping(){

function nextOf(sc){

/* ---------- 추리 보드 (빈칸 채우기) ---------- */
function dedSentence(d, sel, html){
  return String(d.text || "").replace(/\[(\d+)\]/g, (m, n) => {
    const i = Number(n) - 1, b = (d.blanks || [])[i]; if(!b) return m;
    const o = sel[i] !== undefined && sel[i] !== null ? b.opts[sel[i]] : null;
    if(!html) return o ? subst(o.text) : "＿＿";
    return o ? `<span class="dslot on">${esc(subst(o.text))}</span>` : `<span class="dslot">${n} · ${esc(b.label || "빈칸")}</span>`;
  });
}
function renderDeduce(sc){
  const d = sc.ded || {}, box = $("#choices"), blanks = d.blanks || [];
  S.ded = S.ded || {};

  const max = Math.max(1, Number(d.tries) || 3);
  let h = `<div class="dedbox"><div class="dedhead"><span>🧩 ${esc(subst(d.title || "추리"))}</span><span class="ap">${Array.from({length:max}, (_, i) => `<i class="${i < st.left ? "on" : ""}"></i>`).join("")} <b>${st.left}</b></span></div>`;
  h += `<div class="dedsent">${dedSentence(d, st.sel, true)}</div>`;
  blanks.forEach((b, i) => {
    const all = b.opts.map((o, j) => ({o, j, ok:!o.cond || condOK(o.cond)})).filter(x => x.o.text);
    const vis = all.filter(x => x.ok), locked = all.filter(x => !x.ok);
    h += `<div class="dedblank"><div class="dlab"><b>${i + 1}</b> ${esc(subst(b.label || "빈칸"))}</div><div class="dopts">${vis.map(x => `<button class="dopt${st.sel[i] === x.j ? " on" : ""}" data-b="${i}" data-o="${x.j}">${esc(subst(x.o.text))}</button>`).join("")}${locked.map(() => `<button class="dopt lockd" disabled>🔒 ? ? ?</button>`).join("")}</div>${locked.length ? `<div class="dmiss">아직 모르는 보기가 있다. 어딘가 놓친 단서가 있다.</div>` : ""}</div>`;
  });

  h += `<button class="choice dedgo" ${full ? "" : "disabled"}>${full ? "이 추리로 확정한다" : "빈칸을 모두 채워야 한다"}</button></div>`;

      if(d.okEffects) applyEffects(d.okEffects);
      d.okGo ? enter(d.okGo) : showMissing(null); return;
    }
    st.left--; SND.fx("wrong");

function answerQuiz(id, i){

/* ---------- 분기 차트: 같은 장(챕터)의 장면을 자동으로 배치 ---------- */
function exitsOf(sc){
  const a = [];
  if(sc.next) a.push(sc.next);
  (sc.rules || []).forEach(r => r.go && a.push(r.go));
  (sc.choices || []).forEach(c => c.go && a.push(c.go));
  if(sc.timed && sc.timed.on && sc.timed.go) a.push(sc.timed.go);
  if(sc.present && sc.present.on){ (sc.present.opts || []).forEach(o => o.go && a.push(o.go)); if(sc.present.wrongGo) a.push(sc.present.wrongGo); if(sc.present.cancel && sc.present.cancel.go) a.push(sc.present.cancel.go); }
  if(sc.type === "investigate" && sc.inv){ (sc.inv.cards || []).forEach(c => (c.topics || []).forEach(t => t.go && a.push(t.go))); if(sc.inv.endGo) a.push(sc.inv.endGo); }
  if(sc.type === "deduce" && sc.ded){ if(sc.ded.okGo) a.push(sc.ded.okGo); if(sc.ded.failGo) a.push(sc.ded.failGo); }
  return [...new Set(a)];
}
function chartSVG(chapter){
  const list = P.scenes.filter(s => s.chapter === chapter && s.type !== "card" && s.type !== "chart");
  if(!list.length) return {svg:"", pct:0};
  const inCh = new Set(list.map(s => s.id)), depth = {}, state = {}, order = [], back = new Set();
  const adj = id => exitsOf(BY_ID[id]).filter(n => inCh.has(n));
  const dfs = u => { state[u] = 1; adj(u).forEach(v => { if(state[v] === 1) back.add(u + ">" + v); else if(!state[v]) dfs(v); }); state[u] = 2; order.push(u); };
  list.forEach(s => { if(!state[s.id]) dfs(s.id); });
  order.reverse().forEach(u => { depth[u] = depth[u] || 0; adj(u).forEach(v => { if(!back.has(u + ">" + v)) depth[v] = Math.max(depth[v] || 0, depth[u] + 1); }); });
  const rows = [];
  list.forEach(s => { (rows[depth[s.id]] = rows[depth[s.id]] || []).push(s); });
  const W = 360, RH = 92, BH = 36, top0 = 26, pos = {};
  const R = rows.filter(Boolean);
  R.forEach((row, r) => {
    const k = row.length, bw = Math.min(150, (W - (k + 1) * 8) / k), gap = (W - k * bw) / (k + 1);
    row.forEach((s, i) => pos[s.id] = {x:gap + i * (bw + gap), y:top0 + r * RH, w:bw, s});
  });
  let edges = "", boxes = "", got = 0;
  const seen = id => S.visited.includes(id), ever = id => !window.PREVIEW && (META.ever || []).includes(id);
  list.forEach(s => {
    const p = pos[s.id], on = seen(s.id), past = !on && ever(s.id); if(on) got++;
    exitsOf(s).forEach(n => {
      const q2 = pos[n]; if(!q2 || q2.y <= p.y) return;
      const x1 = p.x + p.w / 2, y1 = p.y + BH, x2 = q2.x + q2.w / 2, y2 = q2.y, my = (y1 + y2) / 2;
      const lit = on && seen(n), skip = q2.y - p.y > RH;
      let d = `M${x1} ${y1} C${x1} ${my} ${x2} ${my} ${x2} ${y2}`;
      if(skip){
        const mids = Object.values(pos).filter(o => o.y > p.y && o.y < q2.y);
        const right = (x1 + x2) / 2 >= W / 2;
        const xr = right ? Math.min(W - 2, Math.max(...mids.map(o => o.x + o.w)) + 6) : Math.max(2, Math.min(...mids.map(o => o.x)) - 6);
        d = `M${x1} ${y1} C${x1} ${y1 + 16} ${xr} ${y1 + 10} ${xr} ${y1 + 30} L${xr} ${y2 - 30} C${xr} ${y2 - 10} ${x2} ${y2 - 16} ${x2} ${y2}`;
      }
      const was = !lit && (on || ever(s.id)) && (seen(n) || ever(n)) && (ever(s.id) && ever(n));
      edges += `<path d="${d}" fill="none" stroke="${lit ? "var(--accent)" : was ? "var(--quiet)" : "var(--dim)"}" stroke-width="${lit ? 2 : was ? 1.3 : 1}" ${lit || was ? "" : 'stroke-dasharray="3 4"'} ${was ? 'opacity=".7"' : ""}/>`;
    });
    const note = chartNote(s, on || past);
    if(note){
      const room = Math.max(4, Math.floor((p.w + 16) / 10.5));
      const t = note.text.length > room ? note.text.slice(0, room - 1) + "…" : note.text;
      boxes += `<text x="${p.x + p.w / 2}" y="${p.y - 7}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${note.kind === "key" ? "var(--key)" : note.kind === "open" ? "var(--accent)" : "var(--quiet)"}">${esc(t)}</text>`;
    }
    const maxC = Math.max(2, Math.floor((p.w - 10) / 12));
    const label = on || past ? (s.name.length > maxC ? s.name.slice(0, maxC - 1) + "…" : s.name) : "? ? ?";
    const fs = p.w < 70 ? 11 : 12.5;
    boxes += `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${BH}" rx="8" fill="${on ? "var(--accent-soft)" : past ? "var(--card)" : "var(--bg)"}" stroke="${on ? "var(--accent)" : past ? "var(--quiet)" : "var(--dim)"}" stroke-width="${on ? 1.5 : 1}" ${past ? 'stroke-dasharray="4 3"' : ""}/>`;
    boxes += `<text x="${p.x + p.w / 2}" y="${p.y + BH / 2 + 4.5}" text-anchor="middle" font-size="${fs}" fill="${on ? "var(--ink)" : "var(--quiet)"}">${esc(label)}</text>`;
  });
  const H = top0 + R.length * RH;
  return {svg:`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:440px;display:block;margin:0 auto">${edges}${boxes}</svg>`, pct:Math.round(got / list.length * 100), past:list.some(x => !seen(x.id) && ever(x.id))};
}
/* 차트 상자 위 표시: 🔑 얻은 것 / 🔓 열린 이유 / 🔒 필요한 것 */
const AUTO_LOCK = {};
P.scenes.forEach(x => (x.choices || []).forEach(c => { if(c.go && c.cond && c.whenFalse === "lock" && c.hint && !AUTO_LOCK[c.go]) AUTO_LOCK[c.go] = c.hint; }));
function chartNote(s, on){
  if(on && s.keyNote) return {kind:"key", text:"🔑 " + s.keyNote};
  const lock = s.lockNote || AUTO_LOCK[s.id];
  if(lock) return on ? {kind:"open", text:"🔓 " + lock} : {kind:"lock", text:"🔒"};
  return null;
}
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

let noteTab = "clue";

function noteSig(t){
  if(!S) return "";
  if(t === "clue") return S.clues.length + "";
  if(t === "feed") return S.feedSeen.length + "";
  return P.characters.filter(c => c.always || S.met.includes(c.name)).map(c => c.name + ":" + (c.profile || []).filter(l => l.text && condOK(l.cond)).length).join("|");
}
function noteNew(t){ if(!S) return false; S.noteSeen = S.noteSeen || {}; const sig = noteSig(t); return sig !== (S.noteSeen[t] === undefined ? (t === "people" ? "" : "0") : S.noteSeen[t]); }
function refreshNoteDot(){ const b = $("#noteBtn"); if(!b || !S) return; b.classList.toggle("dot", ["clue", "people"].concat(FEED.length ? ["feed"] : []).some(noteNew)); }
function openNote(){
  const o = $("#note");

}

const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function applyTheme(t){ document.body.classList.toggle("light", t === "light"); $("#themeBtn").innerHTML = t === "light" ? ICON_MOON : ICON_SUN; try{ localStorage.setItem("vn_theme", t); }catch(e){} }

document.title = P.title;
$("#gameTitle").textContent = P.title;
$("#gameSub").textContent = P.subtitle || "";
$("#gameMeta").textContent = P.meta || "화면을 탭해서 진행하세요";
$("#stage").addEventListener("click", tap);
document.addEventListener("keydown", e => { if(e.key === " " || e.key === "Enter"){ e.preventDefault(); tap(); } });
$("#noteBtn").addEventListener("click", e => { e.stopPropagation(); openNote(); });
$("#logBtn").addEventListener("click", e => { e.stopPropagation(); openLog(); });
$("#skipBtn").addEventListener("click", e => { e.stopPropagation(); setSkip(!skipping); });
$("#cpBtn").addEventListener("click", e => { e.stopPropagation(); openChapters(); });
$("#menuBtn").addEventListener("click", e => { e.stopPropagation(); setSkip(false); showTitle(); });
$("#newBtn").addEventListener("click", () => start(true));
$("#contBtn").addEventListener("click", () => start(false));
let theme = "dark"; try{ theme = localStorage.getItem("vn_theme") || "dark"; }catch(e){}
applyTheme(theme);
const ICON_SND_ON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const ICON_SND_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function drawSndBtn(){ const b = $("#sndBtn"); if(b){ b.innerHTML = SND.on ? ICON_SND_ON : ICON_SND_OFF; b.setAttribute("aria-label", SND.on ? "소리 끄기" : "소리 켜기"); } }
function openSndPanel(){
  let pn = $("#sndPanel");
  if(pn){ pn.remove(); return; }
  pn = document.createElement("div"); pn.id = "sndPanel";
  const v = SND.vol, row = (k, name) => `<label class="srow"><span>${name}</span><input type="range" min="0" max="100" step="5" value="${Math.round(v[k] * 100)}" data-k="${k}"><b>${Math.round(v[k] * 100)}</b></label>`;
  pn.innerHTML = `<div class="shead">소리</div>${row("amb", "배경음")}<div class="snote">빗소리, 파도, 사람들 웅성임 같은 깔리는 소리</div>${row("sfx", "효과음")}<div class="snote">글자 나오는 소리, 단서, 경고, 선택 같은 짧은 소리</div><button class="sall">${SND.on ? "소리 전부 끄기" : "소리 켜기"}</button>`;
  document.body.appendChild(pn);
  pn.addEventListener("click", e => e.stopPropagation());
  pn.querySelectorAll("input").forEach(r => r.oninput = () => { const x = Number(r.value) / 100; SND.setVol(r.dataset.k, x); r.nextElementSibling.textContent = r.value; if(!SND.on && x > 0){ SND.setOn(true); drawSndBtn(); pn.querySelector(".sall").textContent = "소리 전부 끄기"; } });
  pn.querySelectorAll("input").forEach(r => r.onchange = () => { if(r.dataset.k === "sfx") SND.fx("clue"); });
  pn.querySelector(".sall").onclick = () => { SND.setOn(!SND.on); drawSndBtn(); pn.querySelector(".sall").textContent = SND.on ? "소리 전부 끄기" : "소리 켜기"; };
  setTimeout(() => document.addEventListener("click", function close(ev){ if(!pn.contains(ev.target)){ pn.remove(); document.removeEventListener("click", close, true); } }, true), 0);
}
if($("#sndBtn")){ drawSndBtn(); $("#sndBtn").addEventListener("click", e => { e.stopPropagation(); openSndPanel(); }); }
$("#themeBtn").addEventListener("click", e => { e.stopPropagation(); theme = theme === "light" ? "dark" : "light"; applyTheme(theme); });
/* ---------- 디버그 패널 (편집기 미리 플레이에서만) ---------- */
function openDebug(){
  const o = $("#note");
  let h = `<div class="panel"><div class="xbar"><button class="xclose" id="dbgClose" aria-label="닫기">✕</button></div><h2>🛠 테스트 도구</h2><div class="sub">미리 플레이에서만 보여요. 값을 바꾸면 바로 적용돼요.</div>`;
  h += `<div class="dbgrow"><label>장면으로 이동</label><select id="dbgGo"><option value="">— 선택 —</option>${P.scenes.map(x => `<option value="${x.id}">${esc((x.chapter ? x.chapter + " · " : "") + x.name)}</option>`).join("")}</select></div>`;
  h += `<h3 class="dbgh">변수</h3>`;
  P.vars.forEach(v => { h += `<div class="dbgrow"><label>${esc(v.name)}</label><input data-v="${esc(v.name)}" value="${esc(VN.show(S.vars[v.name]))}"></div>`; });
  h += `<h3 class="dbgh">단서 <button class="mini" id="dbgAll">전부 얻기</button> <button class="mini" id="dbgNone">전부 지우기</button></h3>`;
  P.clues.forEach(c => { h += `<label class="dbgc"><input type="checkbox" data-c="${esc(c.name)}" ${S.clues.includes(c.name) ? "checked" : ""}> ${esc(c.name)}</label>`; });
  h += `</div>`;
  o.innerHTML = h; o.classList.add("on"); o.scrollTop = 0;
  o.querySelectorAll("input[data-v]").forEach(i => i.oninput = () => { S.vars[i.dataset.v] = VN.val(i.value); drawHud(); });
  o.querySelectorAll("input[data-c]").forEach(i => i.onchange = () => { const n = i.dataset.c; if(i.checked){ if(!S.clues.includes(n)) S.clues.push(n); } else S.clues = S.clues.filter(x => x !== n); });
  $("#dbgAll").onclick = e => { e.stopPropagation(); P.clues.forEach(c => { if(!S.clues.includes(c.name)) S.clues.push(c.name); }); openDebug(); };
  $("#dbgNone").onclick = e => { e.stopPropagation(); S.clues = []; openDebug(); };
  $("#dbgGo").onchange = e => { const id = e.target.value; if(!id) return; o.classList.remove("on"); busy = false; $("#chart").classList.remove("on"); $("#card").classList.remove("on"); clearTimer(); if(typing){ clearInterval(typing.id); typing = null; } $("#log").innerHTML = ""; enter(id); };
  $("#dbgClose").onclick = e => { e.stopPropagation(); o.classList.remove("on"); };
  o.onclick = e => e.stopPropagation();
}
if(window.PREVIEW){ const b = document.createElement("button"); b.id = "dbgBtn"; b.textContent = "🛠 테스트"; b.onclick = e => { e.stopPropagation(); if(S) openDebug(); }; document.body.appendChild(b); }

if(window.PREVIEW_START) start(true); else showTitle();
</script>
</body>
</html>
