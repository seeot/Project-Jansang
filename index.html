<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>게임</title>
<style>

  :root{--bg:#0b0d10;--ink:#d9dde6;--quiet:#7d8596;--line:#232833;--accent:#5aa9ff;--accent-soft:rgba(90,169,255,.14);--card:#141821;--dim:#3a4252;--border:#2c3442;
        --sys-ink:#7fd1b9;--sys-bg:#0f1a17;--sys-bd:#1d3a32;--rec-ink:#9ad8ff;--rec-bd:#2f6f8f;--toast-bg:#13261f;--toast-bd:#2b5a4a;--toast-ink:#9ff0cf;}
  body.light{--bg:#f6f4ef;--ink:#1f2328;--quiet:#6b7280;--line:#e2ded5;--accent:#1f6fd1;--accent-soft:rgba(31,111,209,.10);--card:#ffffff;--dim:#c9c4b8;--border:#d8d3c8;
        --sys-ink:#0f6b52;--sys-bg:#e9f4ef;--sys-bd:#bfdccf;--rec-ink:#1d5f86;--rec-bd:#8fbcd6;--toast-bg:#e9f4ef;--toast-bd:#9fcfbb;--toast-ink:#0f6b52;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;}
  body{overflow:hidden;}
  #top{position:fixed;top:0;left:0;right:0;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(var(--bg) 70%,transparent);z-index:5;}
  #chap{font-size:13px;letter-spacing:.08em;color:var(--quiet);}
  .tbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 14px;font-size:14px;margin-left:6px;}
  #stage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(64px + env(safe-area-inset-top)) 20px 140px;}
  #inner{max-width:680px;margin:0 auto;}
  .line{font-size:18px;line-height:1.85;margin:0 0 16px;transition:opacity .4s;}
  .line.old{opacity:.5;}
  body.light .name{filter:brightness(.62) saturate(1.5);}
  .name{display:block;font-size:13px;font-weight:700;letter-spacing:.04em;margin-bottom:2px;}
  .system{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--sys-ink);background:var(--sys-bg);border:1px solid var(--sys-bd);padding:10px 12px;border-radius:6px;white-space:pre-line;line-height:1.7;}
  .recall{color:var(--rec-ink);font-style:italic;border-left:2px solid var(--rec-bd);padding-left:12px;}
  .glitch{color:#ff6b8b;text-shadow:2px 0 #00e5ff,-2px 0 #ff2e63;animation:jit .18s infinite steps(2);display:inline-block;}
  @keyframes jit{0%{transform:translate(0,0)}50%{transform:translate(-2px,1px)}100%{transform:translate(2px,-1px)}}
  .picked{color:var(--accent);font-size:15px;}
  #more{text-align:center;color:var(--quiet);font-size:13px;animation:blink 1.2s infinite;visibility:hidden;margin-top:-4px;}
  @keyframes blink{50%{opacity:.2}}
  #choices{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .choice{background:var(--card);border:1px solid var(--border);color:var(--ink);font-size:17px;text-align:left;padding:14px 16px;border-radius:10px;font-family:inherit;line-height:1.5;}
  .choice:active{border-color:var(--accent);}
  .choice:disabled{opacity:.4;}
  .choice small{display:block;font-size:12px;color:var(--quiet);margin-top:2px;}
  .timer{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:4px;}
  .timer i{display:block;height:100%;width:100%;background:#ff6b6b;}
  .timerlabel{font-size:12px;color:#ff8a8a;letter-spacing:.06em;}
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;overflow-y:auto;}
  .overlay.on{display:flex;}
  #title h1{font-size:56px;margin:0;letter-spacing:.2em;font-weight:300;}
  #title .en{color:var(--quiet);letter-spacing:.5em;font-size:13px;margin:6px 0 40px;}
  #title button,.bigbtn{display:block;width:240px;margin:8px auto;padding:14px;font-size:16px;background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:10px;font-family:inherit;}
  #title .meta{color:var(--quiet);font-size:12px;margin-top:28px;}
  #card .k{font-size:13px;letter-spacing:.4em;color:var(--quiet);}
  #card .t{font-size:34px;margin:10px 0 6px;font-weight:600;}
  #card .s{color:var(--quiet);}
  #card .tap{margin-top:48px;font-size:12px;color:var(--quiet);animation:blink 1.4s infinite;}
  .panel{max-width:640px;width:100%;text-align:left;margin:auto;padding:40px 0;}
  .panel h2{font-size:22px;margin:0 0 4px;}
  .panel .sub{color:var(--quiet);font-size:13px;margin-bottom:20px;}
  .node{margin:0 0 18px;}
  .node .lbl{font-size:13px;color:var(--quiet);margin-bottom:6px;}
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{border:1px solid #2c3442;border-radius:8px;padding:8px 12px;font-size:14px;color:#566072;}
  .opt.on{border-color:var(--accent);color:var(--ink);background:rgba(90,169,255,.12);}
  .opt.off::before{content:"🔒 ";font-size:11px;}
  .stat{border-top:1px solid var(--line);padding:12px 0;}
  .stat b{display:block;}
  .stat .v{color:var(--accent);font-weight:600;}
  .stat p{margin:4px 0 0;color:var(--quiet);font-size:14px;line-height:1.6;}
  #toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--toast-bg);border:1px solid var(--toast-bd);color:var(--toast-ink);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:all .35s;z-index:20;pointer-events:none;white-space:nowrap;}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  #note .clue{border-bottom:1px solid var(--line);padding:12px 0;}
  #note .clue b{color:var(--sys-ink);}
  #note .clue p{margin:4px 0 0;color:var(--quiet);font-size:15px;line-height:1.6;}
  .danger{color:#ff6b6b;font-weight:600;}
  body.light .danger{color:#c62828;}
  .alert{text-align:center;font-size:15px;letter-spacing:.12em;color:#fff;background:#8b1e2b;border-radius:6px;padding:10px;font-weight:700;}
  .alert.good{background:#1f6f54;}
  body.shake #inner{animation:shk .45s;}
  @keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
  .ending-k{font-size:13px;letter-spacing:.4em;color:var(--quiet);}
  .ending-t{font-size:32px;font-weight:700;margin:8px 0 4px;}
  .ending-s{color:var(--quiet);margin-bottom:24px;}
  .who{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0;font-size:15px;}
  .who span:last-child{color:var(--quiet);}
  .who .dead{color:#ff6b6b !important;}
  .elist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 20px;}
  .elist span{font-size:12px;border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--quiet);}
  .elist span.got{border-color:var(--accent);color:var(--ink);background:var(--accent-soft);}

  #top{gap:12px;}
  #chap{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tbtns{display:flex;gap:8px;flex-shrink:0;}
  .tbtn{width:40px;height:40px;padding:0;margin:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);}
  .tbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  #hud{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top));z-index:4;display:none;gap:6px;justify-content:center;flex-wrap:wrap;padding:4px 12px;pointer-events:none;}
  .hudi{font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:3px 10px;color:var(--ink);}
  #noteBtn{position:relative;}
  #noteBtn.dot::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#ff5a5a;}
  .ntabs{display:flex;gap:6px;margin-bottom:16px;}
  .ntabs button{flex:1;background:var(--card);border:1px solid var(--border);color:var(--quiet);border-radius:10px;padding:10px;font-size:15px;font-family:inherit;}
  .ntabs button.on{color:var(--ink);border-color:var(--accent);background:var(--accent-soft);font-weight:600;}
  .post{border-bottom:1px solid var(--line);padding:12px 0;}
  .post .ph{font-size:14px;margin-bottom:4px;}
  .post .ph span{color:var(--quiet);font-size:13px;}
  .post p{margin:0;line-height:1.7;font-size:15px;white-space:pre-line;}
  .post .pc{margin-top:6px;font-size:13px;color:var(--sys-ink);}
  .stat{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--quiet);margin:6px 0;}
  .meter{display:inline-flex;gap:3px;}
  .meter i{display:inline-block;width:22px;height:8px;border-radius:4px;background:var(--line);transition:background .3s;}
  .meter i.pos{background:#4a8fe8;}
  .meter i.neg{background:#e05a5a;}
  .clue .pl{margin:4px 0 0;font-size:14px;}
  .presentlabel{font-size:14px;color:var(--sys-ink);background:var(--sys-bg);border:1px solid var(--sys-bd);border-radius:8px;padding:10px 12px;}
  .choice.clueopt{border-style:dashed;}
  .hintline{font-size:14px;color:var(--quiet);text-align:center;padding:8px;}
  #toast{top:calc(104px + env(safe-area-inset-top));}
  body.hashud #stage{padding-top:calc(100px + env(safe-area-inset-top));}
  .hudi{font-weight:600;}
  :root{--key:#e6b34a;}
  body.light{--key:#a86b00;}
  .choice.pickbtn{border-style:dashed;border-color:var(--sys-bd);color:var(--sys-ink);text-align:center;font-weight:600;}
  #note.picking{justify-content:flex-start;padding-bottom:110px;}
  .picker .pick{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;color:var(--ink);font-family:inherit;}
  .picker .pick b{display:block;font-size:16px;margin-bottom:3px;}
  .picker .pick span{display:block;font-size:14px;color:var(--quiet);line-height:1.6;}
  .picker .pick.on{border-color:var(--accent);background:var(--accent-soft);}
  .picker .pick.on b::before{content:"✓ ";color:var(--accent);}
  .pickbar{display:none;}
  #note.picking .pickbar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);justify-content:center;}
  #note.picking .pickbar .bigbtn{margin:0;width:auto;flex:1;max-width:300px;}
  .bigbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .bigbtn:disabled{opacity:.45;}
  .tbtns .tbtn{width:38px;height:38px;}
  .tbtns{gap:6px;}
  #skipBtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .line.notice{font-size:13.5px;line-height:1.6;margin:-6px 0 14px;padding:6px 10px;border-radius:6px;background:var(--card);border:1px solid var(--border);color:var(--quiet);display:inline-block;}
  .line.notice.up{color:#4caf8a;border-color:rgba(76,175,138,.4);}
  .line.notice.down{color:#e05a5a;border-color:rgba(224,90,90,.4);}
  .line.notice.change,.line.notice.memo{color:var(--key);border-color:rgba(230,179,74,.4);}
  .line.notice.old{opacity:.6;}
  .backlog p{margin:0 0 10px;line-height:1.7;font-size:15px;}
  .backlog .b-recall{color:var(--rec-ink);font-style:italic;}
  .backlog .b-system{color:var(--sys-ink);font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre-line;}
  .backlog .b-danger,.backlog .b-alert{color:#e05a5a;}
  .backlog .b-glitch{color:#ff7aa5;}
  .backlog .b-pick{color:var(--accent);}
  .backlog .b-notice{color:var(--quiet);font-size:13px;}
  #dbgBtn{position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;background:#3a2f12;color:#ffd77a;border:1px solid #6b5420;border-radius:20px;padding:8px 14px;font-size:14px;font-family:inherit;}
  .dbgrow{display:flex;gap:8px;align-items:center;margin:6px 0;}
  .dbgrow label{flex:0 0 40%;font-size:14px;color:var(--quiet);}
  .dbgrow input,.dbgrow select{flex:1;background:var(--card);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px;font-size:14px;font-family:inherit;min-width:0;}
  .dbgh{font-size:15px;margin:18px 0 6px;}
  .dbgc{display:block;font-size:14px;margin:4px 0;}
  .mini{font-size:12px;background:var(--card);border:1px solid var(--border);color:var(--ink);border-radius:6px;padding:3px 8px;margin-left:6px;}
  #note.picker{justify-content:flex-start;}
  #note .pick{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;color:var(--ink);font-family:inherit;}
  #note .pick b{display:block;font-size:16px;}
  #note .pick span{display:block;font-size:14px;color:var(--quiet);}
  #note,#chart{justify-content:flex-start;}
  .line.notice.warn{color:#e05a5a;border-color:rgba(224,90,90,.45);}
  .invhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sys-ink);background:var(--sys-bg);border:1px solid var(--sys-bd);border-radius:8px;padding:10px 12px;}
  .invhead .ap{display:inline-flex;align-items:center;gap:4px;}
  .invhead .ap i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--sys-ink);}
  .invhead .ap i.on{background:var(--sys-ink);}
  .invhead .ap b{margin-left:4px;}
  .invsec{font-size:12px;color:var(--quiet);letter-spacing:.1em;margin:8px 2px -2px;}
  .invcard{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .invcard.open{border-color:var(--accent);}
  .invcard.empty{opacity:.55;}
  .invhd{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:var(--ink);text-align:left;padding:13px 14px;font-family:inherit;font-size:16px;}
  .invhd span{flex:1;font-size:13px;color:var(--quiet);}
  .invhd b{flex:0 0 auto;}
  .invhd em{font-style:normal;font-size:11px;background:var(--accent);color:#fff;border-radius:9px;padding:2px 8px;}
  .invhd em.done{background:none;color:var(--quiet);}
  .invtopic{display:flex;justify-content:space-between;gap:10px;width:100%;background:var(--accent-soft);border:none;border-top:1px solid var(--border);color:var(--ink);text-align:left;padding:12px 14px;font-family:inherit;font-size:15px;line-height:1.5;}
  .invtopic small{flex:0 0 auto;color:var(--quiet);font-size:12px;}
  .invtopic:disabled{opacity:.4;}
  .choice.invexit{text-align:center;color:var(--quiet);margin-top:4px;}
  .xbar{position:sticky;top:0;z-index:6;display:flex;justify-content:flex-end;height:0;overflow:visible;pointer-events:none;}
  .xclose{pointer-events:auto;margin-top:-28px;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--ink);font-size:18px;line-height:1;font-family:inherit;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);}
  #note .panel{padding-top:44px;}
  #note .ntabs{padding-right:52px;}
  #note .panel > h2, #note .panel > .sub:first-of-type{padding-right:52px;}
  #note .clue .cno{font-style:normal;font-weight:500;font-size:12px;color:var(--quiet);margin-right:8px;font-variant-numeric:tabular-nums;}
  #note .clue.locked b{color:var(--dim);letter-spacing:2px;}
  #note .clue.locked p{color:var(--dim);font-size:13px;}
  #note .clue.locked .cno{letter-spacing:0;}
  #note .panel{margin:0 auto;}
  .post .qtag{font-style:normal;font-size:11px;margin-left:6px;padding:2px 7px;border-radius:9px;background:var(--accent-soft);color:var(--accent);vertical-align:1px;}
  .post.quiz{border-left:3px solid var(--accent);padding-left:12px;}
  .qbox{margin-top:10px;}
  .qbox .qq{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--sys-ink);}
  .qopt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:6px;color:var(--ink);font-family:inherit;font-size:15px;cursor:pointer;}
  .qopt:active{border-color:var(--accent);}
  .qbox .qnote{font-size:12px;color:var(--quiet);}
  .qbox .qmine{font-size:13px;color:var(--quiet);margin-bottom:6px;}
  .qbox .qre{font-size:15px;line-height:1.7;padding:10px 12px;border-radius:10px;background:var(--card);white-space:pre-line;}
  .qbox.ok .qre{border:1px solid var(--accent);}
  .qbox.no .qre{border:1px solid var(--dim);color:var(--quiet);}
  .dedbox{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--card);margin-top:6px;}
  .dedhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;color:var(--sys-ink);margin-bottom:12px;}
  .dedhead .ap i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-left:4px;}
  .dedhead .ap i.on{background:var(--accent);}
  .dedsent{font-size:17px;line-height:2;padding:12px 14px;border-radius:10px;background:var(--bg);margin-bottom:14px;}
  .dslot{display:inline;padding:2px 8px;border-radius:6px;border:1px dashed var(--dim);color:var(--quiet);font-size:14px;white-space:nowrap;}
  .dslot.on{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);font-size:16px;white-space:normal;}
  .dedblank{margin-bottom:12px;}
  .dedblank .dlab{font-size:13px;color:var(--quiet);margin-bottom:6px;}
  .dedblank .dlab b{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:var(--dim);color:var(--ink);font-size:11px;margin-right:4px;}
  .dopts{display:flex;flex-wrap:wrap;gap:6px;}
  .dopt{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:8px 13px;color:var(--ink);font-family:inherit;font-size:14px;cursor:pointer;text-align:left;}
  .dopt.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600;}
  .dedmsg{font-size:14px;color:var(--warn, #e0a050);margin:4px 0 10px;}
  .dedgo{margin-top:6px;}
  .dedgo:disabled{opacity:.5;}
  .ntabs button{position:relative;}
  .ntabs .tdot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:#ff4d4f;border:2px solid var(--bg);}
  .ntabs button{flex:1 1 auto;white-space:nowrap;padding:10px 8px;font-size:14.5px;}
  .choice small.past{display:block;font-size:12px;color:var(--quiet);margin-top:4px;font-weight:400;}
  .dopt.lockd{opacity:.55;border-style:dashed;cursor:not-allowed;letter-spacing:1px;}
  .dedblank .dmiss{font-size:12px;color:var(--quiet);margin-top:6px;}
  #sndPanel{position:fixed;top:58px;right:10px;z-index:60;width:min(300px,calc(100vw - 20px));background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.35);}
  #sndPanel .shead{font-weight:700;margin-bottom:10px;}
  #sndPanel .srow{display:flex;align-items:center;gap:10px;font-size:14px;}
  #sndPanel .srow span{flex:0 0 46px;}
  #sndPanel .srow input{flex:1;accent-color:var(--accent);}
  #sndPanel .srow b{flex:0 0 28px;text-align:right;font-weight:500;color:var(--quiet);font-size:13px;}
  #sndPanel .snote{font-size:12px;color:var(--quiet);margin:2px 0 12px 56px;}
  #sndPanel .sall{width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px;}
  .elist span b{font-weight:700;margin-right:3px;}
  .elist span.ek-true b{color:#e8b64a;}
  .elist span.ek-bad b{color:#e05a5a;}
  .elist span.ek-hidden b{color:#b48ae8;}
  .elist span.now{outline:2px solid var(--accent);}
  .ending-k.ek-true{color:#e8b64a;}
  .ending-k.ek-bad{color:#e05a5a;}
  .ending-k.ek-hidden{color:#b48ae8;}
  /* 삽화 */
  #log .line.ill{margin:6px 0 18px;padding:0;}
  #log .line.ill canvas{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:4px;}
  #log .line.ill.old{opacity:.75;}
  #illFlash{position:fixed;inset:0;background:#e8e6d6;opacity:0;pointer-events:none;z-index:80;}

<script>const PROJECT = {"id": "janssang_v3", "title": "잔상", "subtitle": "AFTERIMAGE", "meta": "추리 · 8챕터 · 엔딩 17개 · 화면을 탭해서 진행하세요", "start": "p_card", "feedTitle": "에코", "characters": [{"name": "한서윤", "color": "#ff9d7a", "bio": "하운 경찰청 강력계 형사, 34세. 8년 동안 리콜 증거로 범인 42명을 잡았다.", "always": false, "profile": [{"text": "부두에서 총에 맞아 다쳤다.", "cond": "서윤 = 부상"}, {"text": "정직 처분을 받았다. 배지도 총도 없다.", "cond": "정직"}, {"text": "규정을 어기고 서진혁의 리콜 원본을 복사했다.", "cond": "원본 복사"}, {"text": "기억이 덮어씌워졌다. 본인은 모른다.", "cond": "서윤 = 덮어쓰기"}, {"text": "체포되어 유치장에 갇혔다.", "cond": "서윤 = 구금"}, {"text": "강태오와 손을 잡았다. 네메시스 기업보안국 국장 내정.", "cond": "강태오 편"}, {"text": "수첩의 글씨로 덮어씌워진 기억을 되찾았다. 강태오는 아직 모른다.", "cond": "기억 회복"}], "stats": [{"label": "리콜을 믿는 마음", "var": "신념"}]}, {"name": "도윤", "color": "#8fd694", "bio": "불법 기억 편집사, 29세. 왼쪽 눈썹에 흉터. 서진혁 살해 용의자로 수배 중.", "always": false, "profile": [{"text": "기억 위조 전과 1범.", "cond": "방문:리콜 재생"}, {"text": "사건 당일 21시, 서진혁의 기억을 칩에 백업해 주었다.", "cond": "단서:서진혁의 백업 칩"}, {"text": "21시 48분, 그가 떠날 때 서진혁은 살아서 손을 흔들었다.", "cond": "단서:도윤의 리콜"}, {"text": "체포되었다.", "cond": "도윤 = 체포"}, {"text": "사망했다.", "cond": "도윤 = 사망"}], "stats": [{"label": "한서윤과의 신뢰", "var": "도윤 신뢰"}]}, {"name": "서하린", "color": "#c6a6ff", "bio": "서진혁의 외동딸, 24세. 네메시스의 최대 주주가 될 사람.", "always": false, "profile": [{"text": "사건 전날 아버지와 회사 매각 문제로 크게 다퉜다.", "cond": "단서:상속 다툼"}, {"text": "22시 41분, 그녀의 키카드로 72층 엘리베이터가 움직였다.", "cond": "단서:하린의 키카드"}, {"text": "그날 밤 아버지 집 문 앞까지 갔다가, 문 너머 목소리를 듣고 돌아섰다.", "cond": "단서:문 너머의 목소리"}, {"text": "한서윤에게 그날 밤의 일을 모두 털어놓았다.", "cond": "하린 증언"}, {"text": "부친 살해 교사 혐의로 체포되었다.", "cond": "하린 = 체포"}, {"text": "사망했다.", "cond": "하린 = 사망"}], "stats": [{"label": "한서윤과의 신뢰", "var": "하린 신뢰"}, {"label": "강태오를 믿는 마음", "var": "하린의 믿음"}]}, {"name": "강태오", "color": "#e6c27a", "bio": "네메시스 공동창업자, 55세. 서진혁의 30년 친구. 하린에게는 삼촌 같은 사람.", "always": false, "profile": [{"text": "사건 당일 밤의 리콜 열람을 거부했다.", "cond": "단서:강태오의 열람 거부"}, {"text": "PROJECT 잔상의 승인자.", "cond": "단서:프로젝트 잔상"}, {"text": "23시 24분, 그의 관리자 계정이 서진혁의 기억을 고쳐 썼다.", "cond": "단서:23:24의 접속"}, {"text": "박주원에게 ‘처리해’라고 지시했다.", "cond": "단서:엿들은 통화"}, {"text": "그날 밤 22시 45분, 펜트하우스에 있었다.", "cond": "단서:문 너머의 목소리 | 단서:하린의 증언"}], "stats": []}, {"name": "마준기", "color": "#e08a8a", "bio": "네메시스 보안팀장, 40대. 말수가 적다. 강태오의 그림자처럼 붙어 다닌다.", "always": false, "profile": [{"text": "현장에서 혼자만 장갑을 끼고 있었다. 왼손 검지에 반창고.", "cond": "단서:마준기의 장갑"}, {"text": "사건 당일 23:00~23:45, 72층 ‘정기 점검’ 근무.", "cond": "단서:보안팀 근무표"}, {"text": "그날 밤 72층 순찰을 빼라고 지시했다.", "cond": "단서:건너뛴 순찰"}, {"text": "출입기록을 지운 계정의 주인.", "cond": "단서:로그 삭제 기록"}], "stats": []}, {"name": "박주원", "color": "#9fb3c8", "bio": "강력계 선배 형사, 40대. 서윤에게 일을 가르쳤다.", "always": false, "profile": [{"text": "압수한 칩을 몰래 반출했다.", "cond": "단서:증거물 반출 기록"}, {"text": "강태오에게 돈을 받고 수사를 도윤 쪽으로 몰았다.", "cond": "단서:박주원의 자백"}, {"text": "체포되었다.", "cond": "박주원 체포"}], "stats": []}, {"name": "서진혁", "color": "#7fc8ff", "bio": "네메시스 대표, 52세. 리콜을 만든 사람. 사망.", "always": false, "profile": [{"text": "죽기 전, 자신의 기억을 칩에 백업해 두었다.", "cond": "단서:서진혁의 백업 칩"}, {"text": "자신이 만든 백도어를 세상에 폭로하려 했다.", "cond": "단서:칩 속의 기억"}, {"text": "자신이 죽으면 올라가도록 글을 예약해 두었다.", "cond": "단서:예약된 계정"}], "stats": []}, {"name": "미로", "color": "#f2a2c0", "bio": "구시가지 지하에서 불법 개조 의안을 파는 기술자. 도윤에게 일을 가르쳤다.", "always": false, "profile": [{"text": "에코의 수수께끼 계정 @labyrinth의 주인.", "cond": "미궁 = 켜짐"}, {"text": "한때 네메시스 연구동에서 잔상 프로토콜 첫 버전을 만들었다.", "cond": "미궁 = 켜짐"}], "stats": []}, {"name": "검시관", "color": "#b0b0b0", "bio": "", "always": false, "profile": [], "stats": []}, {"name": "변호사", "color": "#b0b0b0", "bio": "", "always": false, "profile": [], "stats": []}, {"name": "검사", "color": "#b0b0b0", "bio": "", "always": false, "profile": [], "stats": []}, {"name": "막내", "color": "#b0b0b0", "bio": "", "always": false, "profile": [], "stats": []}, {"name": "경비", "color": "#b0b0b0", "bio": "", "always": false, "profile": [], "stats": []}, {"name": "???", "color": "#b0b0b0", "bio": "", "always": false, "profile": [], "stats": []}, {"name": "기자", "color": "#b0b0b0", "bio": "", "always": false, "profile": [], "stats": []}, {"name": "감식반원", "color": "#b0b0b0", "bio": "", "always": false, "profile": [], "stats": []}], "clues": [{"name": "사망 추정 시각", "desc": "23시 20분 전후. 검시관의 현장 소견."}, {"name": "목덜미의 붉은 점", "desc": "머리카락에 가려진 목덜미의 바늘 자국. 심장마비가 아닐 수도 있다."}, {"name": "지워진 출입기록", "desc": "23:10~23:40, 30분 동안의 건물 출입기록이 통째로 비어 있다."}, {"name": "21시의 손님 D.", "desc": "단말기 일정표: 21:00 D. — 백업 / 현금 결제. 출입기록상 21:48 퇴장."}, {"name": "와인잔 두 개", "desc": "서재 책상 위에 와인잔이 두 개. 하나는 깨끗이 씻겨 있다. 그날 밤 손님이 있었다."}, {"name": "건너뛴 순찰", "desc": "연구동 경비원의 말. 사건 당일 밤, 보안팀장 마준기가 72층 순찰을 빼라고 지시했다."}, {"name": "서비스 엘리베이터 기록", "desc": "23:05, 마스터 키 #2로 서비스 엘리베이터가 72층까지 운행. 사유: 보안 점검."}, {"name": "하린의 키카드", "desc": "22:41, 서하린의 키카드로 로비에서 72층까지. 내려간 기록은 22:45."}, {"name": "0.3초의 튐", "desc": "리콜 영상 속 도윤이 나타나는 순간, 화면이 0.3초쯤 미세하게 튀었다."}, {"name": "마준기의 장갑", "desc": "현장에서 보안팀장 마준기만 실내에서 장갑을 끼고 있었다. 왼손 검지에 반창고."}, {"name": "강태오의 열람 거부", "desc": "사건 당일 밤의 리콜 열람을 임원 보호 규정을 들어 거부했다."}, {"name": "서진혁의 백업 칩", "desc": "“이게 내 마지막 보험이야.” 서진혁의 기억 원본이 담긴 칩."}, {"name": "예약된 계정", "desc": "@afterimage_2047. 서진혁이 자신이 죽으면 올라가도록 글을 예약해 둔 계정."}, {"name": "아버지의 마지막 메시지", "desc": "23:05 발신. “혹시 내게 무슨 일이 생기면, 내 기억을 믿지 마라. 그리고 회사 사람 누구에게도…”"}, {"name": "상속 다툼", "desc": "사건 전날, 하린은 아버지와 크게 다퉜다. “차라리 이 회사가 망해버렸으면 좋겠어요.”"}, {"name": "문 너머의 목소리", "desc": "하린의 기억. 22:45, 아버지 집 문 너머에서 들린 목소리. “넌 이걸 못 터뜨려, 진혁아.” 강태오였다."}, {"name": "하린의 증언", "desc": "하린이 한서윤에게 공식 진술했다. 22:41에 올라갔지만 문을 열지 않고 22:45에 내려왔다. 그때 문 너머에 강태오가 있었다."}, {"name": "증거물 반출 기록", "desc": "압수한 백업 칩이 증거물 보관실에서 반출됐다. 반출자: 박주원."}, {"name": "도윤의 리콜", "desc": "도윤의 기억. 21:48 현관에서 손을 흔드는 서진혁. 22:07 순환선, 23:20 구시가지 국숫집. 사망 추정 시각에 도윤은 12km 떨어진 곳에 있었다. 프레임은 한 번도 끊기지 않는다."}, {"name": "부검 결과", "desc": "서진혁의 혈액에서 신경독 반응. 심정지 유발. 사인은 자연사가 아니다."}, {"name": "저격수의 출입증", "desc": "부두의 저격수가 떨어뜨린 출입증. 네메시스 보안팀, 출입 등급 A."}, {"name": "엘리베이터 CCTV", "desc": "야간 경비가 퍼뜨린 내용. 22:41 하린은 72층에 내렸다가 문도 두드리지 않고 4분 만에 다시 내려갔다."}, {"name": "검은 SUV", "desc": "23:50, 네메시스 타워 지하 주차장에서 번호판을 가린 검은 SUV가 급히 빠져나갔다."}, {"name": "잔상이라는 이름", "desc": "예약된 계정이 남긴 말. 리콜을 편집하는 기술의 이름은 ‘PROJECT 잔상’."}, {"name": "두 개의 마스터 키", "desc": "예약된 계정이 남긴 말. 보안팀 마스터 키는 두 개. 하나는 서진혁의 것."}, {"name": "프로젝트 잔상", "desc": "네메시스 서버의 비공개 폴더. ‘기억 덮어쓰기 프로토콜 v4’. 승인자: 강태오."}, {"name": "23:24의 접속", "desc": "사건 당일 23:24, 강태오의 관리자 계정이 서진혁의 리콜 데이터에 ‘쓰기’를 실행했다."}, {"name": "테트로닌 반출", "desc": "연구소 약품고. 신경독 테트로닌 0.5ml 반출, 사건 당일 20:40. 승인: K.T. 수령: 보안팀."}, {"name": "엿들은 통화", "desc": "강태오가 박주원에게. “형사가 냄새를 맡았어. 도윤 쪽으로 깔끔하게 닫아. 처리해.”"}, {"name": "보안팀 근무표", "desc": "사건 당일 23:00~23:45, 72층 정기 점검 — 담당: 마준기. 점검 보고서는 비어 있다."}, {"name": "로그 삭제 기록", "desc": "23:10~23:40 출입기록 삭제는 마스터 키 #2 계정에서 실행됐다. 계정 주인: MA.JUNGI."}, {"name": "칩 속의 기억", "desc": "서진혁의 기억. 강태오가 말한다. “백도어는 정부도 원해. 넌 이걸 못 터뜨려.” 그리고 마준기에게: “진혁이를 잘 지켜봐.”"}, {"name": "편집 서명", "desc": "서진혁의 마지막 기억에 남은 편집 흔적. 0.312초. 서명: NMS-ROOT / K.TAE."}, {"name": "박주원의 자백", "desc": "“강태오가 시켰다. 칩을 빼돌리고, 사건을 도윤으로 닫으라고.”"}, {"name": "강태오의 말실수", "desc": "하린의 리콜에 남은 강태오의 목소리. 서진혁의 죽음을 자기 입으로 정당화했다."}, {"name": "두 번째 손님", "desc": "미궁의 답. 도윤은 술을 입에 대지 않는다. 씻긴 잔의 주인은 21:48 이후에 찾아와, 서진혁이 직접 문을 열어준 사람이다."}, {"name": "23:39의 인증 실패", "desc": "미궁이 보낸 로그. 23:05 마스터 키 #2 지문 인증 한 번에 통과. 23:39 내려갈 때는 실패, 23:41 비밀번호로 통과. 그 사이 72층에서 손가락을 다쳤다."}, {"name": "현관 센서", "desc": "미궁이 보낸 로그. 22:41~22:45 펜트하우스 현관 안쪽 센서에 서진혁 말고 한 사람이 더 잡혀 있었다. 하린이 문 앞에 섰을 때, 안에는 이미 손님이 있었다."}, {"name": "쓰기 권한", "desc": "미궁의 답. 리콜 원본에 ‘쓰기’를 할 수 있는 계정은 하운 전체에 둘뿐. 서진혁, 그리고 공동창업자."}, {"name": "길 잃은 아이", "desc": "미궁의 글. 자신은 ‘사람을 길 잃게 하는 이름’이고, 길 잃은 아이 하나를 데려다 키웠다고 했다. 언젠가 만나면 알아봐 달라고."}, {"name": "서진혁의 개인 키", "desc": "아빠 사무실 서랍 이중 바닥에 숨겨져 있던 키카드. 메모: ‘칩을 찾으면 이걸로 열어. 내 기억은 나만 열 수 있게 해뒀어. 너만 빼고.’"}, {"name": "공증 백업 로그", "desc": "검증 센터 의자 옆 화면에 떠 있던 글자. ‘쓰기 모드 전환 — 승인: K.TAE’. 그때 마준기가 서윤의 어깨를 누르고 있었다. 강태오는 산 사람의 기억도 고쳐 쓴다."}, {"name": "미리 쓴 체포 보고서", "desc": "한서윤 체포 보고서. 작성 14:50, 작성자 박주원. 서윤이 영장 서명을 거부한 건 15:05. 거부하기도 전에 체포는 정해져 있었다."}, {"name": "사본 열람 신청", "desc": "서윤의 압수 물품 목록. ‘서진혁 리콜 원본 사본 1’. 15:20 열람 신청: ub": "", "keyNote": "", "lockNote": "", "amb": "rain", "cardImg": "표지_1장"}, {"id": "c1_arrive", "name": "현장 도착", "chapter": "1장", "type": "scene", "body": "새벽 1시 40분. 네메시스 타워 72층.\n엘리베이터 문이 열리자 젖은 코트에서 빗물이 떨어졌다. 펜트하우스 안은 지나치게 조용했다.\n박주원: 왔냐, 한서윤. 늦었다.\n한서윤: 비 때문에요. 정말 서진혁 대표예요?\n박주원: 그래. 네메시스 대표. 이 도시 사람 절반 머릿속에 자기 회사 칩을 박아 넣은 양반이지.\n서재 바닥에 남자가 쓰러져 있었다. 쉰두 살. 셔츠 단추 하나가 풀려 있고, 책상 위 단말기는 켜진 채였다.\n박주원: 검시관 말로는 심장마비 같다고 했지만... 복호화 끝나면 바로 리콜부터 보자.\n박주원: 그동안 현장 둘러봐. 40분 줄게. 보안팀이 곧 들이닥친다더라. 회사 사람들이 현장 만지기 전에 볼 거 봐둬.\n{기시감 >= 1} [회상] 이상하다. 처음 와보는 곳인데, 서비스 엘리베이터가 어디 있는지 알 것 같다.\n[시스템] 보안팀이 오기 전까지 행동 네 번. 누구에게 묻고 어디를 볼지 직접 고르자.", "next": "c1_hub", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c1_hub", "name": "현장 조사", "chapter": "1장", "type": "investigate", "body": "", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": "", "inv": {"ap": 4, "title": "현장 조사 · 보안팀이 오기 전까지", "endGo": "c1_recall", "exitText": "조사를 마치고 거실로 간다", "outText": "무전이 울린다. 복호화가 끝났다.", "cards": [{"kind": "person", "name": "박주원", "sub": "거실에서 누군가와 통화 중", "cond": "", "topics": [{"text": "사건 개요를 듣는다", "go": "c1_t_park", "cost": 0, "cond": "", "effects": "", "id": "c1_hub_c0_t0"}, {"text": "부검을 요청한다", "go": "c1_t_autopsy", "cost": 1, "cond": "단서:목덜미의 붉은 점, !부검 요청", "effects": "", "id": "c1_hub_c0_t1"}], "id": "c1_hub_c0"}, {"kind": "person", "name": "검시관", "sub": "시신 옆에 쪼그려 앉 .\n박주원: 그래서? 도윤이 찔렀겠지. 범인은 그대로야.\n한서윤: …그럼 부검은 해도 되죠?\n박주원: …마음대로 해. 결과는 어차피 똑같을 테니까.\n박주원은 그렇게 말하고 돌아섰다. 귀가 조금 붉었다.", "next": "c1_copy_q", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "부검 요청 → 4장 부검 결과", "lockNote": "주사 자국으로 반박"}, {"id": "c1_object_glass", "name": "잔을 지적", "chapter": "1장", "type": "scene", "body": "한서윤: 서재에 와인잔이 두 개였어요. 하나는 씻겨 있고요. 그날 밤 대표는 누군가와 같이 마셨어요.\n한서윤: 불법 편집사랑 와인을 마셨을까요? 손님을 맞을 땐 잔을 내지만, 범인이 잔을 씻진 않잖아요. 숨길 게 있는 사람이 아니라면.\n박주원: …그래서 그 손님이 도윤이었겠지.\n한서윤: 도윤은 21시 48분에 나갔어요. 잔은 씻겨 있었고요.\n박주원은 대답하지 않았다. 대신 창밖을 오래 보았다.", "next": "c1_copy_q", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": "잔으로 반박"}, {"id": "c1_object_log", "name": "기록을 지적", "chapter": "1장", "type": "scene", "body": "{단서:지워진 출입기록} 한서윤: 23시 10분부터 40분까지 출입기록이 지워져 있어요.\n{단서:서비스 엘리베이터 기록} 한서윤: 그리고 23시 05분, 마스터 키로 서비스 엘리베이터가 72층까지 올라왔어요. 보안 점검이라는데 보고서가 없대요.\n한서윤: 도윤 같은 뒷골목 편집사가 네메시스 마스터 키를 갖고 있을까요?\n박주원: …회사 보안 문제는 회사가 알아서 하겠지. 우리 일은 범인 잡는 거야.\n박주원이 서둘러 화제를 돌렸다. 서윤은 그걸 놓치지 않았다.", "next": "c1_copy_q", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": "기록 단서로 반박"}, {"id": "c1_copy_q", False": "hide", "hint": "", "effects": "공유 = 켜짐, 경계 +1", "alts": [], "note": "강태오는 이 대화를 기억할 것이다"}, {"text": "“수사 중인 사안이라서요.” 말을 아낀다", "go": "c1_withhold", "cond": "", "whenFalse": "hide", "hint": "", "effects": "", "alts": []}, {"text": "“그럼 대표님의 어젯밤 리콜부터 보여주시죠.”", "go": "c1_ask", "cond": "", "whenFalse": "hide", "hint": "", "effects": "경계 +1", "alts": [{"cond": "단서:지워진 출입기록", "text": "“출입기록이 지워졌던데요. 대표님 리콜부터 보여주시죠.”"}], "note": "강태오는 이 대화를 기억할 것이다"}], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c1_share", "name": "정보 공유", "chapter": "1장", "type": "scene", "body": "한서윤: …도움이 되겠네요. 지금까지 확인한 건—\n서윤은 메모를 넘기며 설명했다. 강태오는 끝까지 고개를 끄덕이며 들었다.\n{단서:지워진 출입기록} 출입기록이 지워졌다는 대목에서, 그가 아주 잠깐 눈을 깜빡이지 않았다.\n{단서:서비스 엘리베이터 기록} 서비스 엘리베이터 이야기가 나오자, 뒤에 선 마준기가 처음으로 서윤을 똑바로 쳐다봤다.\n강태오: 큰 도움이 됐습니다, 형사님. 범인은 반드시 잡힐 겁니다.", "next": "c1_ma", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c1_withhold", "name": "말을 아낀다", "chapter": "1장", "type": "scene", "body": "한서윤: 감사합니다. 다만 수사 중인 사안이라서요. 필요하면 공식 경로로 요청드리겠습니다.\n강태오: 물론이죠. 당연한 원칙입니다.\n그가 웃었다. 웃는 얼굴이 조금 늦게 따라왔다.", "next": "c1_ma", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "en false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c3_night", "name": "22시 41분", "chapter": "3장", "type": "scene", "body": "하린은 화장실로 들어가 문을 잠근다. 거울 속 얼굴이 낯설다.\n아무에게도 말하지 않은 것이 있다. 그날 밤, 하린은 아버지 집에 갔었다.\n[회상] 22시 41분. 사과하려고 엘리베이터를 탔다. 72층. 현관 앞까지 걸어갔다.\n[회상] 초인종을 누르려는데, 문 너머에서 목소리가 들렸다. 아빠. 그리고 다른 남자.\n[삽화: 22시 41분 문 앞 / 글리치]\n[회상] “넌 이걸 못 터뜨려, 진혁아. 터뜨리면 회사가 끝나고, 네 딸이 받을 것도 끝나.”\n[회상] 낮고 차분한 목소리. 어릴 때부터 들어온 목소리.\n[회상] 하린은 초인종을 누르지 않았다. 손님이 있으면 내일 오면 된다고 생각했다. 22시 45분, 다시 엘리베이터를 탔다.\n[단서: 문 너머의 목소리]\n서하린: 삼촌이었어. …그렇지? 그냥 회사 얘기였겠지.\n그날 밤 거기 갔었다는 걸 누가 알면. 아빠와 싸운 다음 날 밤, 아빠가 죽기 한 시간 전에.\n하린은 거울 속 자신에게서 눈을 돌렸다.", "next": "c3_news_dead", "rules": [{"cond": "도윤 = 자유", "go": "c3_call"}, {"cond": "도윤 = 체포", "go": "c3_news_arrest"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "문 너머의 목소리", "lockNote": ""}, {"id": "c3_call", "name": "도윤의 전화", "chapter": "3장", "type": "scene", "body": "화장실을 나서는데, 모르는 번호로 전화가 걸려온다.\n도윤: 서하린 씨. 끊지 말고 들어요. 도윤이에요.\n서하린: …도윤?\n아침 뉴스 화면이 떠오른다. 수배 전단. 도윤, 성 미상, 29세. 왼쪽 눈썹의 흉터.\n서하린: 뉴스에 나온 그 사람…. …당신이 우리 아빠를—\n도윤: 안 죽였어요. 어젯밤 9시에 당신 아버지 기억을 백업해줬을 뿐이에요. 그분이 그랬어요. 자기가 잘못되면 이걸 당신한테 주라고.\n{칩 = 환풍구} 도윤: 지금은 안전한 데 숨겨뒀어요. 만나면 가지러 같이 가요.\n{칩 = 경찰} 도윤: …근데 그걸 경찰한테 뺏겼어요. 그래도 내가 본 걸 말해줄 수 있어요.\n도윤: 새벽 5시. 7번 부두 창고. 혼자 와요. 경찰이 보이면 난 사라질 거예요.\n통화가 끊기기 직전, 하린은 대답해야 한다.", "next": "", "rules": [], "choices": [{"text": "“갈게요.” 아무에게도 말하지 않는다", "go": "c3_call_meet", "cond": "", "whenFalse": "hide", "hint": "", "effec : "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c3_kang_ask", "name": "되묻는다", "chapter": "3장", "type": "scene", "body": "서하린: 삼촌. 그날 밤 아빠 집에 오셨었죠? 10시 반쯤.\n강태오가 눈을 깜빡였다. 아주 천천히.\n강태오: …아니. 회사에 있었다. 이사회 준비 때문에.\n서하린: 그럼 그날 밤 리콜, 저한테 보여주실 수 있어요?\n강태오: 하린아. 임원 리콜은 회사 기밀이 잔뜩 들어 있어서 법적으로 보호돼. 네가 대표가 되면 알게 될 거다.\n강태오: …누가 너한테 이상한 소리를 했니? 아니면 네가 그날 밤 거기 있었니?\n마지막 질문이 너무 정확했다. 하린은 고개를 저었다. 강태오는 웃었지만, 그 뒤로 조문이 끝날 때까지 하린에게서 눈을 떼지 않았다.\n[단서: 강태오의 열람 거부]", "next": "c3_seoyun", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c3_seoyun", "name": "서윤의 심문", "chapter": "3장", "type": "scene", "body": "추모홀을 나서는 길, 비에 젖은 코트를 입은 여자가 하린을 불러 세운다.\n한서윤: 강력계 한서윤입니다. 잠깐이면 됩니다.\n한서윤: 가정부 분의 리콜을 확인했어요. 사건 전날 밤, 아버님과 크게 다투셨더군요. 회사가 망해버렸으면 좋겠다고요.\n{단서:하린의 키카드} 한서윤: 그리고 사건 당일 22시 41분. 하린 씨 키카드로 72층에 올라간 기록이 있어요. 4분 뒤에 내려왔고요.\n{단서:하린의 키카드} 하린의 손끝이 차가워진다. 알고 있었다.\n한서윤: 형식적인 질문입니다. 하지만 대답은 기록됩니다.", "next": "", "rules": [], "choices": [{"text": "모두 털어놓는다. 그날 밤 문 앞까지 갔고, 목소리를 들었다", "go": "c3_q_all", "cond": "", "whenFalse": "hide", "hint": "", "effects": "하린 증언 = 켜짐, 하린 신뢰 +2, 신념 -1", "alts": [], "note": "하린의 말은 기록되었다"}, {"text": "다툼은 인정한다. 그날 밤 일은 말하지 않는다", "go": "c3_q_half", "cond": "", "whenFalse": "hide", "hint": "", "effects": "하린 거짓말 = 켜짐", "alts": []}, {"text": "“그런 적 없어요.” 전부 부인한다", "go": "c3_q_lie", "cond": "", "whenFalse": "hide", "hint": "", "effects": "하린 거짓말 = 켜짐, 하린 신뢰 -1", "alts": [], "note": "서윤은 이 거짓말을 기억할 것이다"}], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": s": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c3_end", "name": "밤", "chapter": "3장", "type": "scene", "body": "밤 11시. 하린은 텅 빈 아버지의 집 거실에 혼자 앉아 있다.\n리콜 임플란트가 있는 뒤통수를 손끝으로 만져본다. 이 안에 오늘 하루가 전부 저장되고 있다. 그날 밤 문 너머의 목소리도.\n누군가 이걸 고칠 수 있다면. 아빠의 기억도, 내 기억도.\n{만남} 새벽 5시까지 여섯 시간.", "next": "c3_chart", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": "", "amb": "rain"}, {"id": "c3_chart", "name": "3장 분기 차트", "chapter": "3장", "type": "chart", "body": "", "next": "c4_card", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "3장", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c4_card", "name": "4장 표지", "chapter": "4장", "type": "card", "body": "", "next": "c4_open", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "CHAPTER 4", "cardTitle": "부두", "cardSub": "한서윤", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": "", "amb": "rain", "cardImg": "표지_4장"}, {"id": "c4_open", "name": "작업실 수색", "chapter": "4장", "type": "scene", "body": "새벽 4시 10분. 구시가지, 도윤의 작업실.\n감식반이 한 차례 휩쓸고 간 방은 엉망이다. 모니터는 전부 뜯겨 나갔고, 바닥엔 전선이 뱀처럼 엉켜 있다.\n서윤은 혼자 다시 왔다. 이유는 스스로도 잘 모르겠다.\n{방문:주사 자국을 지적 | 부검 요청} 단말기가 울린다. 검시관이다. 서윤이 우겨서 밀어붙인 긴급 부검 결과.\n{방문:주사 자국을 지적 | 부검 요청} 검시관: 혈액에서 신경독 반응이 나왔어요. 심정지를 일으키는 종류예요. 자연사 아닙니다.\n{방문:주사 자국을 지적 | 부검 요청} 한서윤: …신경독.\n{방문:주사 자국을 지적 | 부검 요청} 심장마비가 아니었다. 누군가 서진혁의 몸에 독을 넣었다. 리콜 속 얼굴이 정말 도윤이라면, 구시가지 뒷골목의 편집사가 그런 독을 어디서 구했을까.\n{방문:주사 자국을 지적 | 부검 요청} 검시관: 그리고… 박 형사님한텐 아직 말 안 했어요. 요청하신 건 형사님이니까, 형사님께 먼저 드리는 게 맞는 것 같아서요.\n{방문:주사 자국을 지적 | 부검 요청} 서윤은 잠깐 대답을 고른다. 박주원은 이 사건을 하루 만에 닫으려 했다. 이 결과가 그의 손에 먼저 들어가면, 서랍 속에서 잠들지도 모른다.\n{방문:주사 자국을 지적 | 부검 요청} 한서윤: 잘하셨어요. 정식 보고서는 오전에 올려 주세요. 그 전까지는 저만 알고 있을게요.\n{방문:주사 자국을 지적 | 부검 요청} 검시관: …형사님. 이거, 위험한 일이죠?\n{방문:주사 자국을 지적 | 부검 요청} 한서윤: 아직은 몰라요. 그래서 조용히 하자는 거예요.\n{방문:주사 자국을 지적 | 부검 요청} [단서: 부검 결과]\n{칩 = 경찰} 단말기가 또 진동한다. 증거물 보관실 담당 막내다.\n{칩 = 경찰} [시스템] 선배, 압수한 칩 분석 의뢰하셨죠? 근데 그거 박주원 선배님이 04시 02분에 반출해 가셨는데요. 서명도 있고요.\n{칩 = 경찰} 한서윤: …박 선배가? 왜?\n{칩 = 경찰} [단서: 증거물 반출 기록]\n{칩 = 경찰} [변경: 칩 = 강태오]\n방을 한 바퀴 더 돌았지만 감식반이 놓친 건 없어 보인다. 헛걸음이다. 서윤은 손전등을 끄고 문 쪽으로 돌아선다.\n{만남, !하린 신고, !하린 고자질} 그때 발끝에 뭔가 걸린다. 뒤집힌 의자 밑, 감식반 신발 자국 위에 접힌 종이 한 장.\n{만남, !하린 신고, !하린 고자질} [삽화: 의자 밑 쪽지]\n{만남, !하린 신고, !하린 고자질} 신발 자국 위에 있다는 건, 감식반이 철수한 뒤에 떨어졌다는 뜻이다. 누군가 다녀갔다.\n{만남, !하린 신고, !하린 고자질} [시스템] 볼펜으로 급하게 휘갈긴 글씨\n7 / 05:00 / 창고 B\n{만남, !하린 신고, !하린 고자질} 한서윤: 7… 여기서 걸어갈 수 있는 곳 중에 7번이 붙고 창고가 있는 데라면, 7번 부두.\n{만남, !하린 신고, !하린 고자질} 시계를 본다. 4시 20분. 도윤은 40분 뒤에 누군가를 만난다.", "next": "c4_morgue", "rules": [{"cond": "칩 = 환풍구", "go": "c4_vent"}, {"cond": "도윤 = 자유, 만남", "go": "c4_dock_go"}, {"cond": "도윤 = 자유", "go": "c4_call"}, {"cond": "도윤 = 체포", "go": "c4_interro"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSu : "미로가 드라이버를 내려놓는다. 대답 대신 서랍에서 와인잔 하나를 꺼내, 물을 따라 도윤 앞에 놓는다.\n미로: 넌 아직도 술 안 마시지?\n도윤: …누나였구나.\n미로: 사람을 길 잃게 하는 이름. 미로든 미궁이든. 그리고 길 잃은 애 하나를 주워다 키웠지.\n미로: 나도 한때 네메시스 연구동에 있었어. 잔상 프로토콜 첫 버전을 짠 팀. 그래서 경찰 앞엔 못 나서. 대신 질문은 던질 수 있었지.\n{수수께끼 >= 4} 미로: 내 질문 넷을 전부 푼 사람이 있더라. 이 도시에 아직 눈 뜬 사람이 있다는 거야.\n미로: 그 기자회견 날, 기술 얘기는 내가 카메라 앞에서 직접 할게. 이번엔 숨지 않아.\n[변경: 미궁 = 켜짐, 신뢰 +1]\n[알림] 미로가 기자회견장에서 편집 기술을 증언하기로 했다", "next": "c6_d_chip", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c6_d_chip", "name": "칩의 행방", "chapter": "6장", "type": "scene", "body": "", "next": "c6_d_nochip", "rules": [{"cond": "칩 = 도윤", "go": "c6_d_have"}, {"cond": "칩 = 하린, 하린 = 정상, 하린 도윤 동맹", "go": "c6_d_have_h"}, {"cond": "칩 = 서윤, 서윤 도윤 동맹", "go": "c6_d_have_s"}, {"cond": "칩 = 환풍구", "go": "c6_d_retrieve"}, {"cond": "칩 = 서윤", "go": "c6_d_empty"}, {"cond": "칩 = 강태오, 방문:칩을 제출", "go": "c6_d_empty_gone"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c6_d_empty", "name": "빈 환풍구", "chapter": "6장", "type": "scene", "body": "새벽 3시. 도윤은 옆 건물 옥상을 건너, 자기 작업실 천장 해치로 내려선다.\n환풍구 철망. 나사 두 개가 똑바로 조여져 있다. 도윤이 비뚤게 박아 둔 그 나사가 아니다.\n철망 안은 비어 있다. 먼지 위에 장갑 낀 손가락 자국 두 개.\n도윤: …누가.\n감식반은 환풍구를 열고 이렇게 꼼꼼히 닫지 않는다. 박주원이었다면 지금쯤 뉴스에 나왔을 것이다.\n누군가 이걸 가져가서, 아무에게도 말하지 않고 있다.", "next": "c6_d_meet_s", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c6_d_meet_s", "name": "가게의 형사", "chapter": "6장", "type": "scene", "body": "새벽 5시. 미로의 가게로 돌아온 도윤이 작업대에 엎드려 있을 때, 문에 달린 종이 울린다.\n젖은 코트. 피곤한 눈. 한서윤이다.\n한서윤: 칩 여는 사람을 찾고 있어요. 경찰도, 네메시스도 안 거치고.\n서윤이 코트 안주머니에서 손톱만 한 칩을 꺼낸다. 도윤의 숨이 멎는다.\n도윤: (뒷방 커튼 너머에서) …그거, 제 환풍구에서 가져가셨죠.\n서윤의 손이 총으로 간다. 미로가 두 사람 사이에 드라이버를 내려놓는다.\n미로: 내 가게에서 피 보면 둘 다 출입 금지야.", "next": "", "rules": [], "choices": [{"text": "“같이 열어요. 그다음에 날 잡든지 말든지.”", "go": "c6_d_meet_ok", "cond": "", "whenFalse": "hide", "hint": "", "effects": "서윤 도윤 동맹 = 켜짐, 칩 접근 = 켜짐, 도윤 신뢰 +1", "alts": []}, {"text": "뒷문으로 빠져나간다", "go": "c6_d_meet_run", "cond": "", "whenFalse": "hide", "hint": "", "effects": "", "alts": []}], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c6_d_meet_ok", "name": "작업대 앞의 두 사람", "chapter": "6장", "type": "scene", "body": "도윤이 커튼을 걷고 나온다. 두 손을 보이게 든 채.\n서윤은 한참 그를 보다가, 칩을 작업대 위에 내려놓는다.\n한서윤: 열고 나서 얘기해. 네가 범인이면, 그때 수갑 채울 거야.\n도윤: 그럼 수갑은 영영 못 쓰시겠네요.", "next": "c6_d_src", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c6_d_meet_run", "name": "뒷문", "chapter": "6장", "type": "scene", "body": "도윤은 뒷문으로 빠져나간다. 형사 앞에 다시 설 용기가 아직 없다.\n골목 끝에서 돌아보니, 가게 불은 여전히 켜져 있다. 그 형사는 미로와 함께 칩을 열고 있을 것이다. 도윤 없이.", "next": "c6_d_nochip", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c6_d_empty_gone", "name": "빈 환풍구 (경찰)", "chapter": "6장", "type": "scene", "body": "새벽 3시. 작업실 환풍구. 철망 안은 비어 있다. 나사 옆에 증거물 봉인 스티커 조각.\n도윤: …경찰이 가져갔구나.\n경찰 보관실로 들어간 증거가 어디로 가는지, 도윤은 이제 안다.", "next": "c6_d_nochip", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c6_d_have", "name": "주머니 속의 칩", "chapter": "6장", "type": "scene", "body": "도윤은 주머니에서 칩을 꺼내 작업대에 올려놓는다. 여기까지 오는 내내 한 번도 손에서 놓지 않았다.\n[변경: 칩 접근 = 켜짐]", "next": "c6_d_src", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": "칩을 지켜서 열림"}, {"id": "c6_d_have_h", "name": "하린이 가져온 칩", "chapter": "6장", "type": "scene", "body": "하린이 뒤따라 들어온다. 코트 주머니에서 칩을 꺼내 작업대에 내려놓는다.\n서하린: 아빠 거예요. 제대로 봐줘요.\n[변경: 칩 접근 = 켜짐]", "next": "c6_d_src", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "ca ancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c6_d_retrieve_ok", "name": "옥상으로", "chapter": "6장", "type": "scene", "body": "옆 건물 배수관을 타고 오른다.\n{도윤 부상} 다친 곳이 비명을 지른다. 이를 악문다.\n옥상을 건너 자신의 작업실 천장 해치로 내려선다. 환풍구. 나사 두 개. 칩은 그대로 있다.\n다시 옥상으로 올라가며 내려다보니, SUV는 여전히 현관만 보고 있었다.", "next": "c6_d_src", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "칩 회수", "lockNote": ""}, {"id": "c6_d_retrieve_fail", "name": "현장으로 돌아온 범인", "chapter": "6장", "type": "scene", "body": "기다렸다. 1분. 5분. SUV는 떠나지 않았다.\n대신 등 뒤에서 목소리가 들렸다.\n박주원: 여기 있을 줄 알았다. 범인은 꼭 현장으로 돌아오거든.\n[위험] 목덜미에 차가운 금속이 닿는다.\n그날 새벽, 박주원은 작업실 환풍구를 직접 열었다. 칩은 그의 주머니로 들어갔다.\n[경고] 도윤 — 체포됨", "next": "c6_chart", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c6_d_src", "name": "대조 자료", "chapter": "6장", "type": "scene", "body": "", "next": "c6_lab", "rules": [{"cond": "원본 복사, 서윤 도윤 동맹", "go": "c6_d_src_s"}, {"cond": "서버 사본, 하린 = 정상, 하린 도윤 동맹", "go": "c6_d_src_h"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "" ": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_s_open", "name": "서윤 · 압박", "chapter": "7장", "type": "scene", "body": "오후 3시. 하운 경찰청 강력계. 박주원이 서윤을 자기 자리로 부른다.\n박주원: 앉아. 위에서 그림이 바뀌었다.\n{하린 = 정상, 도윤 = 사망} 박주원: 범인은 죽었지. 근데 혼자 한 짓이 아니라는 거야. 공범이 있다.\n{하린 = 정상, 도윤 = 체포} 박주원: 도윤 단독으로는 법정에서 약해. 배후가 있어야 돼.\n{하린 = 정상, 도윤 = 자유} 박주원: 도윤은 아직 못 잡았고, 혼자 움직이는 놈이 아니야. 돈 대주는 사람이 있다.\n{하린 = 정상} 박주원: 서하린. 사건 전날 아버지랑 상속 문제로 대판 싸웠지. 회사가 망해버렸으면 좋겠다고. 리콜에 다 남아 있어.\n{하린 = 정상, 단서:하린의 키카드} 박주원: 게다가 사건 당일 22시 41분, 72층에 올라갔다 왔어. 키카드 기록이 있다고.\n{하린 = 정상, 하린 거짓말} 박주원: 너한테 거짓말까지 했다며. 그게 결정타야.\n{하린 = 정상, 단서:부검 결과} 박주원: 부검 결과는 나도 봤다. 신경독. 그러니까 더더욱 서하린이야. 독은 가까운 사람이 쓰는 거다.\n{하린 = 정상} 박주원: 서하린이 도윤을 고용했다. 깔끔하잖아. 체포영장 신청서에 네 서명만 있으면 돼.\n{하린 != 정상} 박주원: 사건 종결 보고서다. 네 서명만 있으면 이 일은 끝나.\n박주원이 서류를 내민다. 펜까지 얹어서.", "next": "", "rules": [], "choices": [{"text": "서명한다", "go": "c7_s_sign", "cond": "", "whenFalse": "hide", "hint": "", "effects": "신념 +1", "alts": [{"cond": "하린 = 정상", "text": "서명한다. 서하린 체포영장"}], "note": "이 서명은 누군가의 운명을 바꿀 것이다"}, {"text": "“못 합니다.” 서류를 밀어낸다", "go": "c7_s_refuse", "cond": "", "whenFalse": "hide", "hint": "", "effects": "정직 = 켜짐", "alts": []}, {"text": "“선배. 강태오한테 얼마 받았어요?”", "go": "c7_s_garage", "cond": "단서:증거물 반출 기록 | 단서:엿들은 통화 | 단서:저격수의 출입증", "whenFalse": "hide", "hint": "", "effects": "", "alts": []}, {"text": "“선배. 그 리콜, 조작된 거예요. 선배도 알잖아요.”", "go": "c7_s_doubt", "cond": "신념 \u003c= -1", "whenFalse": "lock", "hint": "리콜을 믿는 마음이 무너져 있어야 한다", "effects": "", "alts": []}], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": "", "amb": "room"}, {"id": "c7_s_doubt", "name": "무너진 믿음", "chapter": "7장", "type": "scene", "body": "한서윤: 선배. 그 리콜, 조작된 거예요. 선배도 알잖아요.\n8년 전의 서윤이라면 상상도 못 했을 말이다. 리콜이 거짓말을 한다는 말.\n박주원의 손이 서류 위에서 멈춘다. 펜이 굴러 바닥에 떨어진다. 그는 줍지 않는다.\n박주원: …그 말, 여기서 다시는 하지 마라.\n박주원: 그 말 하는 사람이 어떻게 되는지 너는 몰라. 나는 알아.\n경고였다. 협박이 아니라, 거의 애원에 가까운.\n박주원은 서류를 거둬들였다. 그날 오후 서윤에게 정직 처분이 내려졌다. 하지만 박주원은 끝내 서명을 강요하지 않았다.\n[변경: 정직 = 켜짐, 경계 +1]", "next": "c7_end_s", "rules": [{"cond": "원본 복사", "go": "c7_j_in"}, {"cond": "공유, 신념 >= 2, !서윤 도윤 동맹", "go": "c7_s_invite"}, {"cond": "하린 = 정상, !하린 증언, !영장, 하린 신뢰 >= 1", "go": "c7_s_harin"}, {"cond": "하린 = 정상, 영장", "go": "c7_h_raid"}, {"cond": "하린 = 정상", "go": "c7_h_dinner"}, {"cond": "도윤 = 자유", "go": "c7_d_open"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_s_sign", "name": "서명", "chapter": "7장", "type": "scene", "body": "서윤은 펜을 들었다. 서명은 생각보다 쉬웠다. 8년 동안 수백 번 해온 일이니까.\n{하린 = 정상} [변경: 영장 = 켜짐, 하린 신뢰 -2]\n박주원: 그래. 그게 너답다.\n그 말을, 어디서 들었더라.", "next": "c7_end_s", "rules": [{"cond": "신념 >= 2, !강태오 편", "go": "c7_s_offer"}, {"cond": "공유, 신념 >= 2, !서윤 도윤 동맹", "go": "c7_s_invite"}, {"cond": "하린 = 정상, !하린 증언, !영장, 하린 신뢰 >= 1", "go": "c7_s_harin"}, {"cond": "하린 = 정상, 영장", "go": "c7_h_raid"}, {"cond": "하린 = 정상", "go": "c7_h_dinner"}, {"cond": "도윤 = 자유", "go": "c7_d_open"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_s_offer", "name": "강태오의 제안", "chapter": "7장", "type": "scene", "body": "밤 9시. 서윤의 단말기에 메시지 하나. 발신: 강태오.\n[시스템] 형사님, 오늘 서명 감사했습니다. 30분만 시간 내주실 수 있을까요. 차는 아래에 와 있습니다.\n네메시스 타워 꼭대기, 대표 집무실. 강태오가 직접 커피를 내린다.\n강태오: 솔직하게 말할게요. 이 사건, 시끄럽게 끝나면 네메시스가 무너집니다. 하운 사람 1200만 명의 머릿속에 우리 칩이 있어요.\n강태오: 회사가 무너지면 리콜도 무너지고, 리콜이 무너지면 이 도시의 재판이 전부 무너집니다. 형사님이 잡은 마흔두 명도요.\n강태오가 서류 한 장을 내민다. 네메시스 기업보안국 국장. 연봉 칸의 숫자가 경찰 월급 몇 년 치다.\n강태오: 형사님 같은 분이 이 도시의 기억을 지켜줬으면 합니다. 사건은 사건대로 깔끔하게 닫고요.\n{단서:0.3초의 튐} 0.3초의 튐이 머릿속을 스친다. 서윤은 그 생각을 눌러 접는다.\n그는 아무것도 자백하지 않았다. 그저, 어느 편에 설지 물었을 뿐이다.", "next": "", "rules": [], "choices": [{"text": "서류를 받아 든다. “조건이 뭐죠?”", "go": "c7_s_deal", "cond": "신념 >= 2", "whenFalse": "lock", "hint": "리콜을, 그리고 이 도시의 규칙을 믿고 있어야 한다", "effects": "강태오 편 = 켜짐", "alts": []}, {"text": "“사양하겠습니다.” 커피에 손대지 않고 일어선다", "go": "c7_s_offer_no", "cond": "", "whenFalse": "hide", "hint": "", "effects": "경계 +1", "alts": []}], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_s_offer_no", "name": "식은 커피", "chapter": "7장", "type": "scene", "body": "강태오는 붙잡지 않았다. 웃으며 엘리베이터까지 배웅했다.\n강태오: 마음 바뀌면 언제든지요. 이 도시엔 시간이 많지 않지만, 형사님한텐 있으니까.\n엘리베이터 문이 닫힌다. 서윤은 그제야 자기 손이 떨리고 있다는 걸 알았다.", "next": "c7_end_s", "rules": [{"cond": "공유, 신념 >= 2, !서윤 도윤 동맹", "go": "c7_s_invite"}, {"cond": "하린 = 정상, !하린 증언, !영장, 하린 신뢰 >= 1", "go": "c7_s_harin"}, {"cond": "하린 = 정상, 영장", "go": "c7_h_raid"}, {"cond": "하린 = 정상", "go": "c7_h_dinner"}, {"cond": "도윤 = 자유", "go": "c7_d_open"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_s_deal", "name": "조건", "chapter": "7장", "type": "scene", "body": "강태오: 조건은 하나예요. 이 사건이 ‘한 사람의 범행’으로 끝나는 것.\n강태오: 누구로 끝낼지는 형사님이 정하세요. 형사님이 가장 잘 아시잖아요. 증거가 가리키는 쪽을.\n{원본 복사} 서윤은 코트 안주머니에서 단말기를 꺼낸다. 몰래 복사해 두었던 서진혁의 리콜 원본. 강태오의 책상 위에 내려놓는다.\n{원본 복사} 강태오: …역시. 믿을 만한 분이네요.\n{원본 복사} [변경: 원본 복사 = 꺼짐]\n{칩 = 서윤} 서윤은 환풍구에서 찾은 칩도 함께 내려놓는다. 강태오의 눈이 아주 잠깐 커졌다가, 다시 웃는다.\n{칩 = 서윤} [변경: 칩 = 강태오]\n마준기가 문을 열어준다. 장갑 낀 손. 서윤은 그 손을 보지 않기로 한다.\n악수는 짧았다. 손이 따뜻했다.\n[경고] 한서윤 — 강태오의 편에 섰다", "next": "c7_end_s", "rules": [{"cond": "하린 = 정상, 영장", "go": "c7_h_raid"}, {"cond": "하린 = 정상", "go": "c7_h_dinner"}, {"cond": "도윤 = 자유", "go": "c7_d_open"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_s_refuse", "name": "거부", "chapter": "7장", "type": "scene", "body": "한서윤: 못 합니다.\n박주원: …한서윤. 너 지금 뭐 하는 건지 알아?\n한서윤: 알아요. 그래서 못 한다는 거예요.\n한 시간 뒤, 서윤의 배지와 총이 반납 상자에 들어간다. 무기한 정직. 내부 감찰.\n{!원본 복사} 서윤은 빈손으로 경찰청을 나왔다. 이상하게 몸이 가벼웠다.", "next": "c7_end_s", "rules": [{"cond": "원본 복사", "go": "c7_j_in"}, {"cond": "공유, 신념 >= 2, !서윤 도윤 동맹", "go": "c7_s_invite"}, {"cond": "하린 = 정상, !하린 증언, !영장, 하린 신뢰 >= 1", "go": "c7_s_harin"}, {"cond": "하린 = 정상, 영장", "go": "c7_h_raid"}, {"cond": "하린 = 정상", "go": "c7_h_dinner"}, {"cond": "도윤 = 자유", "go": "c7_d_open"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote  담뱃불. 하얀 방, 쓰기 모드, 승인 K.TAE. 어깨를 누르던 장갑.\n덮어쓴 기억 위로, 원래의 기억이 피처럼 배어 나온다. 전부는 아니다. 하지만 충분하다.\n서윤은 수첩 첫 장에 한 줄을 더 적었다.\n‘나는 덮어씌워진 척한다.’\n강태오는 서윤이 이제 자기 편이라고 믿을 것이다. 그게 이 싸움에서 서윤이 가진 유일한 기습이다.\n[변경: 서윤 = 정상, 기억 회복 = 켜짐]\n[단서: 공증 백업 로그]\n[알림] 한서윤 — 기억을 되찾았다", "next": "c7_end_s", "rules": [{"cond": "하린 = 정상, 영장", "go": "c7_h_raid"}, {"cond": "하린 = 정상", "go": "c7_h_dinner"}, {"cond": "도윤 = 자유", "go": "c7_d_open"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_s_lost", "name": "덮은 수첩", "chapter": "7장", "type": "scene", "body": "아무리 읽어도, 수첩의 글은 남의 이야기 같았다.\n서윤은 수첩을 서랍 깊숙이 넣고 잠갔다. 머리가 맑았다. 리콜은 거짓말하지 않는다.\n[경고] 기억을 되찾지 못했다", "next": "c7_end_s", "rules": [{"cond": "하린 = 정상, 영장", "go": "c7_h_raid"}, {"cond": "하린 = 정상", "go": "c7_h_dinner"}, {"cond": "도윤 = 자유", "go": "c7_d_open"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_j_in", "name": "체포", "chapter": "7장", "type": "scene", "body": "오후 3시 40분. 서윤이 책상 서랍을 비우고 있을 때, 감찰계 두 명이 다가온다.\n감찰관: 한서윤 경위. 증거물 무단 복제 및 유출 혐의로 체포합니다.\n사무실이 조용해진다. 멀찍이 박주원이 서 있다. 담배를 물었지만 불은 붙이지 않았다.\n수갑. 서윤이 8년 동안 수백 번 채워본 그것이, 이번엔 자기 손목에서 철컥 소리를 낸다.\n[경고] 한서윤 — 체포\n[변경: 서윤 = 구금, 정직 = 켜짐]", "next": "c7_j_cell", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "ef  "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_j_kept", "name": "송치", "chapter": "7장", "type": "scene", "body": "아침 9시. 호송차 창밖으로 하운의 비가 지나간다.\n서윤은 수갑 찬 손을 내려다본다. 이 손으로 마흔두 명을 잡았다. 마흔세 번째는 자기 자신이었다.\n이제 남은 사람들이 해내길 바랄 수밖에 없다.", "next": "c7_end_s", "rules": [{"cond": "하린 = 정상, 영장", "go": "c7_h_raid"}, {"cond": "하린 = 정상", "go": "c7_h_dinner"}, {"cond": "도윤 = 자유", "go": "c7_d_open"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_end_s", "name": "서윤 · 밤", "chapter": "7장", "type": "scene", "body": "", "next": "c7_end", "rules": [{"cond": "하린 = 정상, 영장", "go": "c7_h_raid"}, {"cond": "하린 = 정상", "go": "c7_h_dinner"}, {"cond": "도윤 = 자유", "go": "c7_d_open"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_h_raid", "name": "하린 · 영장", "chapter": "7장", "type": "scene", "body": "밤 9시. 아버지 집 현관에서 초인종이 울린다. 한 번, 두 번, 그리고 문을 두드리는 소리.\n???: 서하린 씨! 경찰입니다! 체포영장 집행하겠습니다!\n인터폰 화면 속에 제복 셋. 그리고 그 뒤에 박주원.\n[위험] 뒷마당 쪽 유리문은 아직 열려 있다.", "next": "", "rules": [], "choices": [{"text": "뒷문으로 도망친다", "go": "c7_h_flee", "cond": "", "whenFalse": "hide", "hint": "", "effects": "", "alts": []}, {"text": "문을 연다", "go": "c7_h_arrested", "cond": "", "whenFalse": "hide", "hint": "", "effects": "하린 = 체포", "alts": []}], "timed": {"on": true, "sec": 6, "go": "c7_h_arrested", "effects": "하린 = 체포", "secRules": []},  "body": "얼음 수레가 쏟아지며 바닥이 빙판이 된다. 우비들이 미끄러진다.\n도윤은 경매장 지붕 아래로 숨어들었다. 숨이 끝까지 차오른다. 아직, 살아 있다.", "next": "c7_end", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_d_escape2", "name": "하수도", "chapter": "7장", "type": "scene", "body": "맨홀 뚜껑을 밀어내고 어둠 속으로 뛰어든다. 무릎까지 차는 구정물.\n머리 위에서 발소리가 지나간다. 도윤은 웃었다. 이 도시의 하수도 지도는 그의 머릿속에 다 있다.", "next": "c7_end", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_d_roll", "name": "칼날", "chapter": "7장", "type": "scene", "body": "", "next": "c7_d_stab", "rules": [{"cond": "확률:35", "go": "c7_d_graze"}], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_d_graze", "name": "운", "chapter": "7장", "type": "scene", "body": "돌아서는 순간, 칼날이 옆구리를 스친다. 아슬아슬하게.\n생선 상자가 무너지며 우비 하나를 덮친다. 운이 좋았다. 이번에는.\n[변경: 도윤 부상 = 켜짐]", "next": "c7_end", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": "35% 운"}, {"id": "c7_d_stab", "name": "칼", "chapter": "7장", "type": "scene", "body": "돌아서는 순간, 옆구리에 둔탁한 충격.\n{도윤 부상} [변경: 도윤 = 사망]\n{도윤 = 사망, 칩 = 도윤} [변경: 칩 = 강태오]\n{도윤 = 사망} 이미 상한 몸 깊숙이 칼날이 들어간다. 도윤은 생선 상자 위로 쓰러진다.\n{도윤 = 사망} 시장의 소음이 멀어진다. 누군가 비명을 지른다. 아무도 다가오지 않는다.\n{도윤 = 사망} [경고] 도윤 — 사망\n{도윤 = 자유} 칼이 옆구리를 스친다. 도윤은 상대의 손목을 비틀어 꺾고, 인파 속으로 쓰러지듯 뛰어든다.\n{도윤 = 자유} [변경: 도윤 부상 = 켜짐]\n{도윤 = 자유} [시스템] [도윤 — 부상]", "next": "c7_end", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_end", "name": "반격 끝", "chapter": "7장", "type": "scene", "body": "하운에 나흘째 비가 내린다.\n강태오는 오늘 오후 3시, 네메시스 신임 대표 취임 기자회견을 연다.\n그 자리에서 모든 것이 끝날 것이다. 어느 쪽으로든.", "next": "c7_chart", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c7_chart", "name": "7장 분기 차트", "chapter": "7장", "type": "chart", "body": "", "next": "c8_router", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "7장", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c8_router", "name": "8장 라우터", "chapter": "8장", "type": "scene", "body": "", "next": "c8_F harin", "cond": "하린 = 정상", "whenFalse": "hide", "hint": "", "effects": "", "alts": []}, {"text": "세 번째 서류철을 집는다. 아무도 아니다", "go": "c8_k_cold", "cond": "", "whenFalse": "hide", "hint": "", "effects": "", "alts": []}], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c8_k_doyun", "name": "도윤으로 닫다", "chapter": "8장", "type": "scene", "body": "한서윤: 도윤. 리콜에 얼굴이 있어요. 법원은 그거면 됩니다.\n강태오가 만족스럽게 고개를 끄덕인다. 박주원이 서류철을 덮는다.\n{도윤 != 사망} 한서윤: 남은 건 체포뿐이에요. 제가 직접 하죠.", "next": "c8_end_K1", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c8_k_harin", "name": "하린으로 닫다", "chapter": "8장", "type": "scene", "body": "한서윤: 서하린. 동기, 기회, 거짓말. 세 개 다 있어요. 도윤은 고용된 손일 뿐이고요.\n강태오가 처음으로 망설인다. 찻잔을 내려놓는 소리가 조금 크다.\n강태오: …하린이는 내 조카 같은 아이입니다.\n한서윤: 그러니까 더 믿을 만하죠. 대표님이 가장 슬퍼하는 얼굴로 서 계시면 됩니다.\n강태오는 한참 서윤을 본다. 이 형사가 생각보다 위험한 사람이라는 걸, 그제야 알았다는 눈으로.", "next": "c8_end_K2", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c8_k_cold", "name": "미제", "chapter": "8장", "type": "scene", "body": "한서윤: 아무도요. 증거 불충분. 미제 사건으로 묻죠.\n박주원: …범인 없이 끝내자고?\n한서윤: 범인이 있으면 재판이 열리고, 재판이 열리면 누군가 리콜을 의심하기 시작해 {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c8_open", "name": "기자회견", "chapter": "8장", "type": "scene", "body": "오후 3시. 네메시스 타워 1층 그랜드홀. 신임 대표 취임 기자회견.\n플래시가 터진다. 단상 위의 강태오는 검은 넥타이를 매고 있다. 고인을 기리는 의미라고 했다. 그 뒤에 마준기가 서 있다.\n강태오: 진혁이가 지키고자 했던 것을, 이제 제가 지키겠습니다.\n{정직} 서윤은 배지 없이 홀에 들어섰다. 정직 중인 형사. 그래도 검찰청 강력부 검사 한 명이 서윤의 연락을 받고 뒷줄에 와 있다.\n{!정직} 서윤은 배지를 들고 홀 가운데로 걸어 나갔다. 뒷줄에는 서윤이 부른 검사가 앉아 있다.\n{서윤 = 부상} 상처가 욱신거린다. 괜찮다. 끝까지 서 있을 수만 있으면.\n{기억 회복} 단상 위의 강태오가 서윤을 발견하고, 안심한 듯 가볍게 고개를 끄덕인다. 자기가 고쳐 쓴 형사를 보는 눈이다.\n{미궁 = 켜짐} 기자석 맨 뒷줄, 후드를 깊게 눌러쓴 미로가 앉아 있다. 눈이 마주치자 고개를 한 번 끄덕인다.\n{하린 = 정상, 하린 신뢰 >= 2} 맨 앞줄 유족석에서 하린이 일어나 서윤 쪽으로 걸어온다. 고인의 딸이 형사 옆에 선다. 카메라가 그 장면을 놓치지 않는다.\n{하린 = 정상, 하린 신뢰 >= 2} [변경: 신뢰 +1]\n{하린 = 정상, 하린 신뢰 \u003c= -1} 유족석의 하린은 서윤을 보고도 고개를 돌린다. 기자 몇 명이 그걸 눈치챈다.\n{하린 = 정상, 하린 신뢰 \u003c= -1} [변경: 신뢰 -1]\n{도윤 = 자유, 도윤 신뢰 >= 2} 서윤의 단말기에 메시지 하나. ‘홀 와이파이 잡았어요. 형사님이 내미는 거, 전부 에코로 생중계할게요.’\n{도윤 = 자유, 도윤 신뢰 >= 2} [변경: 신뢰 +1]\n한서윤: 실례합니다. 하운 경찰청 강력계 한서윤입니다.\n한서윤: 서진혁 대표 살인 사건에 대해, 이 자리에서 말씀드릴 게 있습니다.\n웅성거림. 카메라가 일제히 서윤을 향한다. 강태오의 변호사가 단상에서 내려온다.\n변호사: 형사님. 이건 공식 절차가 아닙니다. 하실 말씀이 있으면 근거부터 대시죠. 하나라도 헛소리면, 그대로 명예훼손입니다.\n검사: (작게) 한 형사. 기회는 많지 않아. 사람들이 등을 돌리기 시작하면 끝이야.\n[시스템] 신뢰: {{신뢰}}. 틀린 단서를 내밀 때마다 줄어든다. 0이 되면 끝이다.", "next": "", "rules": [], "choices": [{"text": "“범인은 강태오입니다.”", "go": "c8_t1", "cond": "단서:문 너머의 목소리 | 단서:하린의 증언 | 단서:23:24의 접속 | 단서:프로젝트 잔상 | 단서:엿들은 통화 | 단서:칩 속의 기억 | 단서:편집 서명 | 단서:박주원의 자백 | 단서:강태오의 열람 거부 | 단서:강태오의 말실수 | 단서:와인잔 두 개 | 단서:쓰기 권한 | 단서:공증 백업 로그", "whenFalse": "hide", "hint": "", "effects": "", "alts": []}, {"text": "“범인은 마준기입니다.”", "go": "c8_s_ma", "cond": "단서:마준기의 장갑 | 단서:서비스 엘리베이터 기록 | 단서:보안팀 근무표 | 단서:로그 삭제 기록 | 단서:칩 속의 기억 | 단서:건너뛴 순찰 | 단서:저격수의 출입증 | 단서:23:39의 인증 실패 | 단서:공증 백업 로그", "whenFalse": "hide", "hint": "", "effects": "", "alts": []}, {"text": "“범인은 박주원 형사입니다.”", "go": "c8_s_park", "cond": "단서:증거물 반출 기록 | 단서:엿들은 통화 | 단 : "", "effects": "", "alts": []}], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c8_d_broadcast", "name": "송출", "chapter": "8장", "type": "scene", "body": "칩을 꽂는다. 화면에 진행 바가 뜬다. 송출 준비 — 30초.\n[위험] 아래쪽 계단에서 발소리. 검은 정장 둘. 맨 앞은 장갑 낀 남자.\n[시스템] 송출 준비 — 18초\n[위험] 마준기가 총을 뽑는다.", "next": "", "rules": [], "choices": [{"text": "몸으로 장비를 막고 버틴다", "go": "c8_end_P", "cond": "", "whenFalse": "hide", "hint": "", "effects": "", "alts": []}, {"text": "수동 송출 레버를 당긴다", "go": "c8_end_P", "cond": "", "whenFalse": "hide", "hint": "", "effects": "", "alts": []}], "timed": {"on": true, "sec": 5, "go": "c8_end_F2", "effects": "도윤 = 사망", "secRules": [{"cond": "도윤 부상", "sec": 3}]}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "", "endSub": "", "keyNote": "", "lockNote": ""}, {"id": "c8_end_K1", "name": "엔딩 새 주인", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n{도윤 = 사망} 도윤은 ‘피의자 사망, 공소권 없음’으로 기록되었다. 그의 이름은 한 달 만에 뉴스에서 사라졌다.\n{도윤 != 사망} 도윤은 사흘 뒤 구시가지 국숫집 앞에서 체포되었다. 수갑을 채운 건 서윤이었다. 도윤은 끝까지 서윤의 눈을 보지 않았다.\n{도윤 != 사망} 법원은 리콜 영상을 근거로 무기징역을 선고했다. 리콜은 거짓말하지 않으니까.\n{하린 = 정상} 하린은 아버지의 장례식 이후 하운을 떠났다. 떠나기 전 서윤에게 메시지 한 줄을 남겼다. ‘당신도 결국 그쪽이었군요.’\n서윤은 네메시스 기업보안국 국장이 되었다. 사무실 창밖으로 하운 전체가 내려다보인다.\n강태오와의 저녁 식사는 한 달에 한 번. 그는 늘 와인을 두 잔 따른다. 서윤은 늘 한 잔만 마신다.\n{단서:0.3초의 튐} 가끔, 아주 가끔, 서윤은 보고서를 넘기다 손을 멈춘다. 0.3초. 그 짧은 튐.\n{단서:0.3초의 튐} 그럴 때면 서윤은 수첩을 꺼내, 아무것도 적지 않은 채 다시 덮는다.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "새 주인", "endSub": "리콜은 거짓말하지 않는다. 이제 그 말을 서윤이 지킨다.", "keyNote": "", "lockNote": "", "endKind": "bad", "endOrder": 13, "endImg": "엔딩_새 주인"}, {"id": "c8_end_K2", "name": "엔딩 상속받은 죄", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n서하린은 존속살해 교사 혐의로 체포되었다. 도윤은 그녀에게 고용된 손으로 기록되었다.\n하린의 변호인은 리콜 영상의 0.3초를 문제 삼았다. 법원은 ‘복호화 노이즈’라는 네메시스의 감정서를 받아들였다.\n하린은 법정에서 한 번도 서윤을 보지 않았다. 판결이 나던 날, 딱 한 번 돌아봤다. 그리고 웃었다. 서윤이 아는 누군가와 너무 닮은 웃음이었다.\n네메시스의 지분은 상속 결격으로 이사회에 넘어갔다. 이사회 의장, 강태오.\n서윤은 기업보안국 국장이 되었다. 강태오는 그 뒤로 서윤에게 한 번도 등을 보이지 않았다.\n서로를 믿지 않는 두 사람이, 이 도시의 기억을 함께 지키고 있다.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "상속받은 죄", "endSub": "아버지를 잃은 딸이, 아버지를 죽인 사람이 되었다.", "keyNote": "", "lockNote": "", "endKind": "bad", "endOrder": 14, "endImg": "엔딩_상속받은 죄"}, {"id": "c8_end_K3", "name": "엔딩 미궁", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n서진혁 살인 사건은 증거 불충분으로 미제 처리되었다. 리콜 영상은 ‘복호화 오류로 증거 능력 없음’으로 봉인되었다.\n{도윤 != 사망} 도윤의 수배는 조용히 풀렸다. 그는 하운을 떠났다. 떠나기 전 에코에 글 하나를 남겼다. ‘형사님, 그 0.3초 기억해요?’ 글은 한 시간 뒤 지워졌다.\n{하린 = 정상} 하린은 아버지를 죽인 사람이 없다는 판결문을 받았다. 그녀는 그 종이를 끝까지 버리지 않았다.\n{미궁 = 켜짐} @labyrinth 계정은 그날 이후 다시는 글을 올리지 않았다. 마지막 글은 하나였다. ‘길을 잃은 건, 당신이었어.’\n강태오의 취임 기자회견은 박수 속에 끝났다. 맨 앞줄에 서윤이 앉아 있었다.\n미궁은 아무도 다치지 않게 한다. 다만, 아무도 구하지도 않는다.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "미궁", "endSub": "범인은 없다. 그래서 아무도 묻지 않는다.", "keyNote": "", "lockNote": "", "endKind": "bad", "endOrder": 15, "endImg": "엔딩_미궁"}, {"id": "c8_end_A", "name": "엔딩 잔상 너머", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n그날 밤, ‘프로젝트 잔상’의 문서가 전 세계에 공개되었다.\n하운 시민 1,200만 명이 같은 질문을 던졌다. 내 기억은 진짜인가.\n리콜 증거로 유죄를 받은 사건 3,400건이 재심에 들어갔다. 도시는 오래 흔들렸다.\n마준기는 끝까지 아무 말도 하지 않았다. 강태오는 법정에서 단 한 번, 서진혁의 이름을 부르며 울었다.\n{도윤 = 사망} 도윤의 이름은 무죄 판결문에 올랐다. 그는 그 판결문을 직접 읽지 못했다.\n{도윤 != 사망} 도윤은 무죄 판결문을 액자에 넣어 미로의 가게에 걸었다. 미로는 촌스럽다고 했다.\n{하린 = 정상} 하린은 아버지의 무덤에 흰 국화를 놓았다. 이번엔 사진 속 아버지가 조금 다르게 웃는 것 같았다.\n서윤은 그날 이후로도 리콜 증거를 쓴다. 다만 이제는, 한 번 더 돌려본다.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "잔상 너머", "endSub": "강태오와 마준기는 체포되고, 백도어는 세상에 드러났다.", "keyNote": "", "lockNote": "", "endKind": "true", "endOrder": 0, "endImg": "엔딩_잔상 너머"}, {"id": "c8_end_B", "name": "엔딩 조용한 정의", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n서하린: 회사가 수사에 성실히 협조하겠습니다.\n강태오와 마준기는 살인 혐의로 무기징역을 선고받았다. 동기는 ‘경영권 분쟁’으로 정리되었다.\n‘프로젝트 잔상’이라는 이름은 판결문 어디에도 나오지 않았다.\n서윤은 판결문을 읽고, 하린에게 전화를 걸었다. 하린은 받지 않았다.\n네메시스 신임 대표 서하린. 취임 1년 뒤, 그녀의 집무실 금고에는 서버 접근 키 하나가 잠겨 있다.\n하린은 가끔 그 금고를 바라본다. 아빠라면 어떻게 했을까. 답은 알고 있다. 그래서 바라만 본다.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "조용한 정의", "endSub": "살인자는 잡혔지만, 백도어는 다시 어둠 속으로 묻혔다.", "keyNote": "", "lockNote": "", "endKind": "normal", "endOrder": 1, "endImg": "엔딩_조용한 정의"}, {"id": "c8_end_P", "name": "엔딩 폭로", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n{방문:진실의 화면} 생중계 화면이 꺼지지 않는다. 방송국은 끊으려 했지만, 이미 수백만 명이 녹화하고 있었다.\n{방문:진실의 화면} 마준기가 하린에게 다가오다 멈춘다. 카메라가 너무 많다.\n{방문:송출} 송출이 시작된다. 도시의 모든 화면이 강태오의 취임식에서 서진혁의 기억으로 바뀐다.\n{방문:송출} 총성. 도윤은 장비에 등을 기댄 채 웃는다. 진행 바는 100%를 찍었다.\n{방문:송출} 도윤은 송신탑 아래로 끌려 내려갔다. 그 뒤로 그를 본 사람은 없다. 다만 그날 이후, 하운의 공중 단말기마다 누군가 낙서를 남겼다. 21:48.\n법정은 끝내 강태오를 살인죄로 묶지 못했다. 증거 능력 논란, 변호인단, 정치권의 침묵.\n하지만 도시는 보았다. 네메시스의 주가는 사흘 만에 휴지 조각이 되었고, 리콜 착용자의 40%가 임플란트를 제거했다.\n강태오는 해외로 떠났다. 마준기는 실종되었다. 그들이 어디 있는지는 아무도 모른다. 아니, 모두가 안다. 다만 아무도 말하지 않는다.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "폭로", "endSub": "법정 대신 도시 전체가 진실을 보았다.", "keyNote": "", "lockNote": "", "endKind": "normal", "endOrder": 2, "endImg": "엔딩_폭로"}, {"id": "c8_end_N", "name": "엔딩 빈 손", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n변호인단은 서윤의 주장을 하나씩 해체했다. 기자들은 서윤의 얼굴을 클로즈업했다. 미친 형사.\n강태오는 명예훼손으로 서윤을 고소했다. 서윤은 파면되었다.\n사건은 다시 도윤으로 정리되었다.\n서윤은 지금 항구 근처 경비 회사에서 일한다. 밤마다 머릿속으로 그날의 퍼즐을 다시 맞춘다. 어디서 틀렸을까. 무엇이 부족했을까.\n답은 알고 있다. 범인은 강태오다. 다만 이제 그 말을 믿어주는 사람이 없을 뿐.", "next": "", "rules": [], "choices": [], "timed": {"on": false, "sec": 6, "go": "", "effects": "", "secRules": []}, "present": {"on": false, "prompt": "", "opts": [], "wrongGo": "", "wrongEffects": "", "cancel": {"text": "", "go": "", "effects": ""}}, "cardLabel": "", "cardTitle": "", "cardSub": "", "chartOf": "", "endTitle": "빈 손", "endSub": "범인을 알았지만, 증명하지 못했다.", "keyNote": "", "lockNote": "", "endKind": "bad", "endOrder": 7, "endImg": "엔딩_빈 손"}, {"id": "c8_end_C", "name": "엔딩 완벽한 증거", "chapter": "엔딩", "type": "ending", "body": "[변경: 기시감 +1]\n\n{도윤 != 사망} 도윤은 무기징역을 선고받았다. 법정에서 마지막으로 그가 한 말은 “21시 48분”이었다. 아무도 그 의미를 묻지 않았다.\n{도윤 = 사망} 죽은 도윤은 공소권 없음으로 정리되었다. 판결문 대신
